<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Chordetect logo">
  <!-- Full square background so adaptive masks show a dark circle -->
  <rect width="120" height="120" fill="#1C1B1F"/>

  <!-- Foreground bars (maximize size while keeping a small safe margin) -->
  <g fill="#D0BCFF">
    <rect x="18" y="12" width="20" height="96" rx="5"/>
    <rect x="50" y="12" width="20" height="96" rx="5"/>
    <rect x="82" y="12" width="20" height="96" rx="5"/>
  </g>

  <!-- Dark key overlays centered on the purple bars -->
  <g fill="#1C1B1F">
    <rect x="38" y="12" width="12" height="56" rx="3"/>
    <rect x="70" y="12" width="12" height="56" rx="3"/>
  </g>
</svg>
