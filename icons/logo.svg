<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Chordetect logo">
  <!-- Full square background so adaptive masks show a dark circle -->
  <rect width="120" height="120" fill="#000000"/>

  <!-- Foreground bars: three identical stripes with larger black margins for a true safe area -->
  <g fill="#D0BCFF">
    <rect x="35" y="25" width="10" height="70" rx="5"/>
    <rect x="55" y="25" width="10" height="70" rx="5"/>
    <rect x="75" y="25" width="10" height="70" rx="5"/>
  </g>
</svg>
