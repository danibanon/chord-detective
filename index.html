<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Chord Detective">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#140804">
<meta name="description" content="Detect chords from the on-screen piano or a connected MIDI keyboard.">
<title>Chord Detective</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:only light;
  --bg:#140804;
  --border:rgba(255,177,104,.16);--border-strong:rgba(255,183,102,.3);
  --text:#f2dfcb;--text-soft:#c8a98b;--dim:#8b684f;
  --accent:#ffad52;--accent-strong:#ffbf75;
  --white-pill:rgba(255,202,138,.12);--white-pill-border:rgba(255,183,102,.24);
  --root-pill:linear-gradient(135deg,rgba(255,187,102,.28),rgba(212,122,34,.18));
  --root-pill-border:rgba(255,196,124,.58);
  --note-pill:rgba(255,173,82,.08);--note-pill-border:rgba(255,173,82,.18);
  --shadow:0 24px 60px rgba(0,0,0,.45);
  --glow:0 0 0 1px rgba(255,173,82,.08),0 0 28px rgba(255,126,32,.12);
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation}
body{
  background:
    radial-gradient(circle at top,rgba(255,136,40,.13),transparent 28%),
    radial-gradient(circle at bottom,rgba(186,87,16,.1),transparent 32%),
    linear-gradient(180deg,#1d0b05 0%,#110603 48%,#090302 100%);
  overflow:hidden;
}
.app{
  display:grid;min-height:100dvh;width:100%;
  padding:10px;gap:8px;
  grid-template-columns:minmax(160px,1.1fr) minmax(220px,1.4fr) minmax(120px,.7fr);
  grid-template-rows:minmax(0,1fr) minmax(0,1fr);
  grid-template-areas:
    "notes chord controls"
    "piano piano piano";
  background:
    linear-gradient(180deg,rgba(255,255,255,.01),rgba(255,255,255,0)),
    linear-gradient(90deg,rgba(255,173,82,.03),transparent 18%,transparent 82%,rgba(255,173,82,.03));
  overflow:hidden;
  touch-action:manipulation;
}
.notes-strip{
  grid-area:notes;
  display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:10px;min-height:0;min-width:0;padding:10px 12px;
  background:linear-gradient(180deg,rgba(34,16,10,.86),rgba(19,10,7,.84));
  border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow),var(--glow);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  touch-action:pan-x;
}
.notes-strip::-webkit-scrollbar{display:none}
.notes-strip.empty{align-items:center;justify-content:center}
.notes-strip.empty::before{
  content:'No notes selected';
  font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);
  text-align:center;
}
.pill{
  min-height:36px;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap;flex-shrink:0;letter-spacing:.05em;
  border:1px solid var(--white-pill-border);background:var(--white-pill);color:var(--text-soft);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;
}
.pill.root{
  background:var(--root-pill);border-color:var(--root-pill-border);color:#fff3e4;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 18px rgba(255,148,41,.15);
}
.pill.note{background:var(--note-pill);border-color:var(--note-pill-border);color:var(--accent-strong)}
.clear{
  background:linear-gradient(180deg,rgba(255,176,88,.24),rgba(187,99,26,.18));border:1px solid var(--border-strong);color:#fff2e4;
  padding:6px 13px;border-radius:999px;font-family:inherit;font-size:10px;cursor:pointer;
  white-space:nowrap;flex-shrink:0;transition:border-color .12s,box-shadow .12s,background .12s,transform .12s;letter-spacing:.06em;text-transform:uppercase
}
.clear:hover{border-color:rgba(255,196,124,.6);box-shadow:0 0 18px rgba(255,148,41,.14)}
.clear:active{transform:translateY(1px);background:linear-gradient(180deg,rgba(255,188,114,.4),rgba(196,104,29,.26))}
.midi-btn{
  background:rgba(255,173,82,.08);border:1px solid var(--border);color:var(--text-soft);
  padding:6px 12px;border-radius:999px;font-family:inherit;font-size:10px;cursor:pointer;
  white-space:nowrap;transition:border-color .12s,color .12s,box-shadow .12s,transform .12s;letter-spacing:.06em;text-transform:uppercase
}
.midi-btn:hover{border-color:rgba(255,196,124,.6);color:var(--accent-strong)}
.midi-btn:active{transform:translateY(1px)}
.midi-btn.on{
  background:linear-gradient(180deg,rgba(255,176,88,.24),rgba(187,99,26,.18));
  border-color:var(--border-strong);color:#fff2e4;
  box-shadow:0 0 18px rgba(255,148,41,.14)
}
.midi-btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.controls-panel{
  grid-area:controls;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:flex-start;
  min-width:0;
  gap:6px;
  padding:10px;
  border:1px solid var(--border);border-radius:16px;
  background:linear-gradient(180deg,rgba(34,16,10,.9),rgba(19,10,7,.86));
  box-shadow:var(--shadow),var(--glow);
}
.panel-brand{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 10px;
  border:1px solid rgba(255,177,104,.12);
  border-radius:14px;
  background:linear-gradient(180deg,rgba(43,19,12,.82),rgba(28,12,8,.76));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  overflow:hidden;
}
.panel-brand-inner{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(5px,1vw,10px);
  width:100%;
  max-width:100%;
  min-width:0;
}
.panel-brand-icon{
  width:clamp(16px,2vw,24px);height:clamp(16px,2vw,24px);
  border-radius:clamp(4px,.5vw,6px);
  display:block;
  flex-shrink:0;
}
.panel-brand-icon img{
  display:block;
  width:100%;
  height:100%;
}
.panel-brand-copy{
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:clamp(3px,.8vw,7px);
  flex-wrap:nowrap;
  white-space:nowrap;
  text-transform:uppercase;
  letter-spacing:.08em;
  line-height:1;
  min-width:0;
}
.panel-brand-copy b{
  color:var(--accent-strong);
  font-size:clamp(8px,1.1vw,13px);
  font-weight:700;
}
.panel-brand-copy span{
  color:var(--text-soft);
  font-size:clamp(7px,.95vw,11px);
}
.ctl{
  min-width:0;min-height:0;
  display:flex;align-items:center;justify-content:center;gap:8px;
  flex:0 0 auto;
  width:100%;
  padding:9px 12px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,173,82,.06);color:var(--text-soft);
  font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;transition:border-color .12s,color .12s,transform .12s,background .12s;
}
.ctl:hover{border-color:rgba(255,196,124,.6);color:var(--accent-strong)}
.ctl:active{transform:translateY(1px)}
.ctl.on{
  background:rgba(255,176,88,.12);
  border-color:var(--border-strong);color:#fff2e4;
}
.ctl:disabled{opacity:.55;cursor:default;box-shadow:none}
.ctl-label{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.midi-indicator{
  width:8px;height:8px;border-radius:999px;flex-shrink:0;
  background:rgba(255,214,176,.18);
  box-shadow:0 0 0 1px rgba(255,183,102,.22);
}
.midi-btn[data-state="live"] .midi-indicator{background:#8be68d;box-shadow:0 0 14px rgba(139,230,141,.45)}
.midi-btn[data-state="pending"] .midi-indicator{background:#ffbf75;box-shadow:0 0 14px rgba(255,191,117,.36)}
.midi-btn[data-state="denied"] .midi-indicator,
.midi-btn[data-state="unsupported"] .midi-indicator{background:#ff7d7d;box-shadow:0 0 14px rgba(255,125,125,.34)}
.midi-btn[data-state="idle"] .midi-indicator{background:#d0b296}
.midi-btn .ctl-label{min-width:auto}
.chord-zone{
  grid-area:chord;
  flex-shrink:0;
  display:grid;place-items:center;
  padding:14px 18px 12px;
  position:relative;min-height:0;min-width:0;
  border:1px solid var(--border);border-radius:18px;
  background:
    radial-gradient(circle at top center,rgba(255,160,64,.2),transparent 34%),
    linear-gradient(180deg,rgba(10,4,2,.96),rgba(20,10,6,.94));
  box-shadow:var(--shadow),var(--glow);
  overflow:hidden;
}
.chord-main{
  display:flex;align-items:baseline;justify-content:center;
  gap:.04em;line-height:1;position:relative;z-index:1;
}
.chord-root{
  font-size:80px;font-weight:700;color:var(--accent-strong);
  letter-spacing:-.03em;line-height:1;
  text-shadow:0 0 26px rgba(255,155,56,.16);
  transition:opacity .2s,transform .2s;
}
.chord-sym{
  font-size:34px;font-weight:600;color:var(--accent-strong);
  padding-bottom:.28em;letter-spacing:.01em;
  text-shadow:0 0 22px rgba(255,155,56,.15);
  transition:opacity .2s;
}
.chord-sym sup{font-size:.62em;vertical-align:2em;line-height:0;font-weight:600}
.chord-slash{
  font-size:80px;font-weight:700;color:var(--accent-strong);
  letter-spacing:-.03em;line-height:1;
  text-shadow:0 0 26px rgba(255,155,56,.16);
  transition:opacity .2s,transform .2s;
  padding-bottom:0;
}
.hidden{opacity:0;pointer-events:none}
.chord-ph{
  font-size:13px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  white-space:nowrap;
}
.chord-type{
  margin-top:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);min-height:15px;text-align:center;position:relative;z-index:1;
  transition:color .15s;
}
.chord-type.known{color:var(--text)}
.chord-type.inv{color:var(--accent)}
.piano-wrap{display:flex;align-items:center;justify-content:flex-start;
  flex:1 1 auto;
  padding:16px 40px 12px;overflow:hidden;border:1px solid var(--border);border-radius:30px;
  background:linear-gradient(180deg,rgba(33,15,10,.92),rgba(14,7,5,.96));
  box-shadow:var(--shadow),var(--glow);
  position:relative;touch-action:none;cursor:grab}
.piano-wrap.dragging{cursor:grabbing}
.oct-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  width:28px;height:48px;border-radius:8px;border:1px solid var(--border);
  background:#0d0503;color:var(--text-soft);font-size:14px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;flex-shrink:0;
  transition:background .12s,border-color .12s,color .12s,opacity .15s;
  opacity:.8;touch-action:none;
  box-shadow:0 2px 8px rgba(0,0,0,.6);
}
.oct-btn:hover{background:rgba(40,20,10,.92);border-color:var(--border-strong);color:var(--accent-strong);opacity:1}
.oct-btn:active{background:rgba(60,30,12,.95);color:var(--accent)}
.oct-btn.disabled{opacity:.2;pointer-events:none}
.oct-btn-l{left:6px}
.oct-btn-r{right:6px}
/* Piano key sizing via CSS vars — resizeKeys() updates them; CSS transitions handle smooth resize */
#piano{
  position:relative;filter:drop-shadow(0 18px 28px rgba(0,0,0,.36));
  --ww:33px;--wh:172px;--bw:20px;--bh:110px;
  transition:width .12s ease,height .12s ease;
  will-change:transform;
}
.key{position:absolute;top:0;cursor:inherit;border-radius:0 0 4px 4px;touch-action:none}
.key.white{
  width:var(--ww);height:var(--wh);
  background:linear-gradient(180deg,#fff5e7 0%,#eed8bc 55%,#e0c5a3 100%);
  border:1px solid rgba(106,74,52,.45);border-top:none;z-index:1;
  transition:background .18s ease,box-shadow .18s ease,filter .18s ease
}
.key.white:hover{background:linear-gradient(180deg,#fff7ea 0%,#f3e0c6 58%,#e6cbab 100%);filter:saturate(1.02)}
.key.white.on{background:linear-gradient(180deg,#ffc879 0%,#f1a24b 60%,#d47a22 100%);border-color:rgba(120,69,27,.62);box-shadow:inset 0 0 0 1px rgba(255,244,226,.28)}
.key.black{
  width:var(--bw);height:var(--bh);
  background:linear-gradient(180deg,#31160d 0%,#1a0a06 100%);border:1px solid #090402;border-top:none;
  box-shadow:0 8px 14px rgba(0,0,0,.72),inset 0 -1px 0 rgba(255,255,255,.06);z-index:2;
  transition:background .18s ease,box-shadow .18s ease,filter .18s ease
}
.key.black:hover{background:linear-gradient(180deg,#3a1a10 0%,#24100a 100%);filter:brightness(1.05)}
.key.black.on{background:linear-gradient(180deg,#e18d37 0%,#af5b16 100%);box-shadow:0 4px 7px rgba(0,0,0,.5),0 0 22px rgba(255,133,29,.22)}
.klabel{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  font-size:8px;color:#7f654d;pointer-events:none;letter-spacing:.06em;text-transform:uppercase}
.key.white.on .klabel{color:#381c07;font-weight:700}
.key.black .klabel,.key.black.on .klabel{display:none}

/* chord-inner keeps the chord stack centered inside the universal landscape panel */
.chord-inner{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;z-index:1;flex:1 1 auto;
  grid-area:1/1;
  width:max-content;max-width:100%;
  min-width:0;
}
.piano-wrap{grid-area:piano;min-width:0}
.orientation-overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:rgba(9,3,2,.9);
  backdrop-filter:blur(12px);
  transition:opacity .18s ease;
}
.orientation-overlay.hidden{opacity:0;pointer-events:none}
.orientation-card{
  width:min(420px,100%);
  padding:22px 18px;
  border-radius:20px;
  border:1px solid var(--border-strong);
  background:linear-gradient(180deg,rgba(31,14,9,.96),rgba(16,8,5,.94));
  box-shadow:var(--shadow),var(--glow);
  text-align:center;
}
.orientation-icon{
  font-size:44px;line-height:1;margin-bottom:10px;color:var(--accent-strong);
}
.orientation-copy{
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-soft);
}

@media (max-width:980px){
  .app{
    grid-template-columns:minmax(130px,.95fr) minmax(190px,1.3fr) minmax(108px,.72fr);
    padding:8px;gap:6px;
  }
  .notes-strip,.controls-panel,.chord-zone,.piano-wrap{border-radius:14px}
  .notes-strip{padding:8px 10px;gap:8px}
  .controls-panel{padding:8px;gap:5px}
  .panel-brand{padding:7px 8px}
  .ctl{padding:8px 10px;font-size:9px}
  .pill{min-height:30px;padding:6px 12px;font-size:12px}
  .chord-zone{padding:10px 14px}
  .chord-root{font-size:min(72px,16vw)}
  .chord-sym{font-size:min(30px,7vw);padding-bottom:3px}
  .chord-slash{font-size:min(72px,16vw)}
}

@media (max-width:700px){
  .app{
    grid-template-columns:minmax(92px,.95fr) minmax(132px,1.3fr) minmax(86px,.76fr);
    grid-template-rows:minmax(0,1fr) minmax(0,1fr);
    padding:5px;gap:5px;
  }
  .notes-strip{padding:6px 7px;gap:5px}
  .controls-panel{padding:5px;gap:4px}
  .panel-brand{padding:6px 7px}
  .panel-brand-copy b{font-size:10px}
  .panel-brand-copy span{font-size:8px}
  .ctl{padding:6px 8px;font-size:8px;border-radius:10px}
  .midi-btn{gap:6px}
  .pill{min-height:22px;padding:4px 8px;font-size:9px}
  .chord-zone{padding:8px 8px}
  .chord-zone::after{display:none}
  .notes-strip.empty::before{font-size:9px;letter-spacing:.08em}
  .chord-ph{font-size:9px;letter-spacing:.08em}
  .chord-root{font-size:min(44px,12vw)}
  .chord-sym{font-size:min(17px,5vw);padding-bottom:1px}
  .chord-slash{font-size:min(44px,12vw)}
  .chord-type{margin-top:3px;min-height:11px;font-size:9px}
}

@media (max-height:520px){
  .app{
    grid-template-columns:minmax(96px,.9fr) minmax(160px,1.45fr) minmax(104px,.78fr);
    grid-template-rows:minmax(0,1fr) minmax(0,1fr);
    padding:5px;gap:5px;
  }
  .notes-strip{padding:7px 8px;gap:6px}
  .notes-strip.empty::before{font-size:10px}
  .pill{min-height:24px;padding:4px 10px;font-size:10px}
  .controls-panel{padding:6px;gap:4px}
  .panel-brand{padding:6px 8px}
  .panel-brand-copy b{font-size:11px}
  .panel-brand-copy span{font-size:9px}
  .ctl{padding:6px 8px;font-size:8px;border-radius:10px}
  .midi-indicator{width:7px;height:7px}
  .chord-zone{padding:8px 10px;border-radius:14px}
  .chord-zone::after{display:none}
  .chord-inner{gap:2px}
  .notes-strip.empty::before{font-size:10px;letter-spacing:.08em}
  .chord-ph{font-size:10px;letter-spacing:.08em}
  .chord-root{font-size:min(58px,20vh)}
  .chord-sym{font-size:min(23px,9vh);padding-bottom:2px}
  .chord-slash{font-size:min(58px,20vh)}
  .chord-type{margin-top:4px;min-height:12px;font-size:10px}
  .piano-wrap{padding:4px 34px 4px;border-radius:14px}
  .oct-btn{
    width:24px;height:42px;border-radius:8px;
    background:rgba(12,5,3,.97);
    border-color:rgba(255,183,102,.32);
    box-shadow:0 2px 10px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.4);
    opacity:1;
  }
  .oct-btn.disabled{opacity:.25}
}

@media (max-height:280px){
  .app{grid-template-columns:minmax(82px,.82fr) minmax(130px,1.5fr) minmax(92px,.82fr)}
  .ctl{padding:5px 6px;font-size:7px;border-radius:9px}
  .pill{min-height:20px;padding:3px 8px;font-size:9px}
  .chord-root{font-size:min(46px,18vh)}
  .chord-sym{font-size:min(18px,8vh)}
  .chord-slash{font-size:min(46px,18vh)}
  .chord-type{font-size:9px}
}
</style>
</head>
<body>
<div class="app" id="app">
<div class="notes-strip" id="pills"></div>
<div class="chord-zone">
  <div class="chord-inner">
    <div class="chord-ph" id="cph">tap keys to start</div>
    <div class="chord-main">
      <div class="chord-root hidden" id="croot"></div>
      <div class="chord-sym hidden" id="csym"></div>
      <div class="chord-slash hidden" id="cslash"></div>
    </div>
    <div class="chord-type" id="ctype"></div>
  </div>
 </div>
<div class="controls-panel" aria-label="App controls">
  <div class="panel-brand" aria-hidden="true">
    <div class="panel-brand-inner">
      <div class="panel-brand-icon"><img src="./icons/icon.svg" alt=""></div>
      <div class="panel-brand-copy">
        <b>Chord</b>
        <span>Detective</span>
      </div>
    </div>
  </div>
  <button type="button" class="ctl clear" id="clrBtn" aria-label="Clear all notes"><span class="ctl-label">Clear notes</span></button>
  <button type="button" class="ctl" id="flatBtn" aria-label="Toggle sharps and flats"><span class="ctl-label">Flats</span></button>
  <button type="button" class="ctl midi-btn" id="midiBtn" aria-label="Connect MIDI device" data-state="idle">
    <span class="midi-indicator" aria-hidden="true"></span>
    <span class="ctl-label" id="midiBtnLabel">MIDI</span>
  </button>
</div>
<div class="piano-wrap">
  <div id="piano"></div>
</div>
</div>
<div class="orientation-overlay hidden" id="orientationOverlay" aria-hidden="true">
  <div class="orientation-card" role="alert" aria-live="polite">
    <div class="orientation-icon" aria-hidden="true">⤾</div>
    <div class="orientation-copy" id="orientationCopy">Rotate to landscape</div>
  </div>
</div>
<script>
// === AppConfig ===

const AppConfig={
  minMidi:21,
  maxMidi:108,
  blackSemitones:new Set([1,3,6,8,10]),
  sharpNames:['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],
  flatNames:['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'],
  chordPatterns:[

// === MusicTheory ===

function getPitchClass(note){
  return ((note%12)+12)%12;
}

function getNoteNames(useFlats){
  return useFlats?AppConfig.flatNames:AppConfig.sharpNames;
}

function formatMidiNoteName(midi,useFlats){
  const noteNames=getNoteNames(useFlats);
  return `${noteNames[getPitchClass(midi)]}${Math.floor(midi/12)-1}`;
}

function detectChord(notes,useFlats){
  if(notes.length<2)return null;

  const pitchClasses=[...new Set(notes.map(getPitchClass))].sort((a,b)=>a-b);
  const bassPitchClass=getPitchClass(Math.min(...notes));
  const candidateRoots=[bassPitchClass,...pitchClasses.filter(pc=>pc!==bassPitchClass)];
  const noteNames=getNoteNames(useFlats);

  for(const rootPc of candidateRoots){
    const intervals=pitchClasses
      .map(pc=>(pc-rootPc+12)%12)
      .sort((a,b)=>a-b);

    const match=AppConfig.chordPatterns.find(pattern=>
      pattern.intervals.length===intervals.length
      && pattern.intervals.every((value,index)=>value===intervals[index])
    );

    if(match){
      const inversion=bassPitchClass!==rootPc;
    return{
      rootPc,
      rootName:noteNames[rootPc],
      sym:match.sym,
      name:match.name,
      longName:match.longName,
      slash:inversion?`/${noteNames[bassPitchClass]}`:'',
      inv:inversion,
    };
    }
  }

  return null;
}

function formatChordQualityHtml(symbol){
  if(!symbol)return'';
  const normalized=symbol.replace(/°/g,'o');
  if(normalized==='m'){
    return 'm';
  }
  if(normalized.length>1&&normalized[0]==='m'){
    return `m${formatChordQualityHtml(normalized.slice(1))}`;
  }
  return `<sup>${normalized}</sup>`;
}

function splitChordSymbol(symbol){
  if(!symbol)return{quality:'',slashPart:''};
  const match=symbol.match(/\/([A-G](?:#|♭)?)$/);
  if(!match)return{quality:symbol,slashPart:''};
  return{
    quality:symbol.slice(0,-match[0].length),
    slashPart:match[0],
  };
}

function formatSpokenNoteName(noteName){
  return noteName
    .replace(/#/g,' sharp')
    .replace(/♭/g,' flat')
    .replace(/\s+/g,' ')
    .trim();
}

function formatChordSubtitle(chord){
  const rootText=formatSpokenNoteName(chord.rootName);
  const qualityText=chord.longName||chord.name.toLowerCase();
  const bassText=chord.slash
    ?formatSpokenNoteName(chord.slash.slice(1))
    :'';

  return bassText
    ?`${rootText} ${qualityText} over ${bassText}`
    :`${rootText} ${qualityText}`;
}

// === PianoLayout ===

function getViewport(){
  return{
    width:window.innerWidth,
    height:window.innerHeight,
  };
}

function getVisibleOctaves(width){
  if(width<520)return 2;
  if(width<860)return 3;
  if(width<1260)return 4;
  return 5;
}

function getDefaultWindowMidi0(width){
  return width<1260?48:36;
}

function buildPianoRange(){
  let whiteIndex=0;
  const keys=[];

  for(let midi=AppConfig.minMidi;midi<=AppConfig.maxMidi;midi++){
    const isBlack=AppConfig.blackSemitones.has(getPitchClass(midi));
    const gWi=isBlack?Math.max(0,whiteIndex-1):whiteIndex;
    keys.push({midi,isBlack,gWi});
    if(!isBlack)whiteIndex++;
  }

  return{keys,totalWhiteKeys:whiteIndex};
}

const PianoRange=buildPianoRange();
const allowedWindowStartsCache=new Map();

function getMaxWindowStart(nocts){
  return Math.max(AppConfig.minMidi,AppConfig.maxMidi-nocts*12+1);
}

function getAllowedWindowStarts(nocts){
  if(allowedWindowStartsCache.has(nocts))return allowedWindowStartsCache.get(nocts);

  const maxStart=getMaxWindowStart(nocts);
  const starts=[];

  for(let midi=AppConfig.minMidi;midi<=maxStart;midi++){
    if(!AppConfig.blackSemitones.has(getPitchClass(midi))){
      starts.push(midi);
    }
  }

  allowedWindowStartsCache.set(nocts,starts);
  return starts;
}

function clampWindowMidi0(midi0,nocts){
  const starts=getAllowedWindowStarts(nocts);
  if(!starts.length)return AppConfig.minMidi;

  return starts.reduce((best,start)=>
    Math.abs(start-midi0)<Math.abs(best-midi0)?start:best,
  starts[0]);
}

function getCenteredWindowMidi0(notes,nocts,currentMidi0){
  if(!notes.length)return clampWindowMidi0(currentMidi0,nocts);

  const minNote=Math.min(...notes);
  const maxNote=Math.max(...notes);
  const span=nocts*12;
  const currentStart=clampWindowMidi0(currentMidi0,nocts);

  if(minNote>=currentStart&&maxNote<=currentStart+span-1){
    return currentStart;
  }

  const unclampedIdeal=(minNote+maxNote)/2-span/2+6;
  const centeredStart=clampWindowMidi0(unclampedIdeal,nocts);
  if(maxNote-minNote+1>span)return centeredStart;

  const maxStart=getMaxWindowStart(nocts);
  const candidateStarts=getAllowedWindowStarts(nocts).filter(start=>
    start>=Math.max(AppConfig.minMidi,maxNote-span+1)
    && start<=Math.min(maxStart,minNote)
  );

  if(!candidateStarts.length)return centeredStart;

  return candidateStarts.reduce((best,start)=>
    Math.abs(start-unclampedIdeal)<Math.abs(best-unclampedIdeal)?start:best,
  candidateStarts[0]);
}

function getKeyDimensions(nocts,viewport,wrapWidth){
  const rawWhiteKeyWidth=Math.min((wrapWidth-80)/(7*nocts),78);
  const maxWhiteKeyHeight=Math.min(viewport.height*.46,430);
  const minWhiteKeyHeight=viewport.height<520?80:140;
  const whiteKeyWidth=Math.max(1,Math.round(rawWhiteKeyWidth));
  const whiteKeyHeight=Math.round(
    Math.max(minWhiteKeyHeight,Math.min(whiteKeyWidth*5.2,maxWhiteKeyHeight))
  );
  const blackKeyWidth=Math.max(1,Math.round(whiteKeyWidth*.6));
  const blackKeyHeight=Math.max(1,Math.round(whiteKeyHeight*.64));
  return{
    whiteKeyWidth,
    whiteKeyHeight,
    blackKeyWidth,
    blackKeyHeight,
  };
}

function getDisplayModel(currentState,viewport,reason='auto',forceStructure=false){
  const activeNotes=getActiveNotes(currentState);
  const visibleOctaves=getVisibleOctaves(viewport.width);
  const defaultWindowMidi0=getDefaultWindowMidi0(viewport.width);
  const currentWindowMidi0=currentState.piano.windowMidi0??defaultWindowMidi0;
  let nextWindowMidi0;

  if(reason==='resize'||reason==='clear'){
    nextWindowMidi0=activeNotes.length
      ?getCenteredWindowMidi0(activeNotes,visibleOctaves,currentWindowMidi0)
      :clampWindowMidi0(defaultWindowMidi0,visibleOctaves);
  }else if(reason==='midi'&&activeNotes.length){
    nextWindowMidi0=getCenteredWindowMidi0(activeNotes,visibleOctaves,currentWindowMidi0);
  }else if(activeNotes.length&&currentState.piano.hasManualPan){
    nextWindowMidi0=clampWindowMidi0(currentWindowMidi0,visibleOctaves);
  }else if(activeNotes.length){
    nextWindowMidi0=getCenteredWindowMidi0(activeNotes,visibleOctaves,currentWindowMidi0);
  }else{
    nextWindowMidi0=clampWindowMidi0(currentWindowMidi0,visibleOctaves);
  }

  const chord=activeNotes.length>1?detectChord(activeNotes,currentState.useFlats):null;
  const singleNoteRootPc=activeNotes.length===1?getPitchClass(activeNotes[0]):null;
  const highlightedRootPc=chord?chord.rootPc:singleNoteRootPc;

  return{
    viewport,
    noteNames:getNoteNames(currentState.useFlats),
    activeNotes,
    chord,
    highlightedRootPc,
    piano:{
      nocts:visibleOctaves,
      windowMidi0:nextWindowMidi0,
      structureChanged:
        forceStructure
        || currentState.piano.nocts!==visibleOctaves
        || currentState.keys.size===0,
    },
  };
}

// === State ===

function createInitialState(){
  return{
    manual:new Set(),
    midiHeld:new Set(),
    midiActive:new Set(),
    sustainPedalDown:false,
    keys:new Map(),
    piano:{windowMidi0:null,nocts:2,translateX:0,hasManualPan:false},
    midiAccess:null,
    midiSupported:'requestMIDIAccess' in navigator,
    useFlats:true,
    resizeTimer:null,
  };
}

const state=createInitialState();

function getActiveNotes(currentState){
  return [...currentState.manual,...currentState.midiActive].sort((a,b)=>a-b);
}

function isMidiActive(currentState,midi){
  return currentState.manual.has(midi)||currentState.midiActive.has(midi);
}

function toggleManualNote(currentState,midi){
  if(currentState.manual.has(midi))currentState.manual.delete(midi);
  else currentState.manual.add(midi);
}

function clearAllNotes(currentState){
  currentState.manual.clear();
  clearMidiHeldNotes(currentState);
}

function clearMidiHeldNotes(currentState){
  currentState.midiHeld.clear();
  currentState.midiActive.clear();
  currentState.sustainPedalDown=false;
}

function setMidiHeld(currentState,midi,isHeld){
  if(isHeld){
    currentState.midiHeld.add(midi);
    currentState.midiActive.add(midi);
    return;
  }

  currentState.midiHeld.delete(midi);
  if(!currentState.sustainPedalDown){
    currentState.midiActive.delete(midi);
  }
}

function setSustainPedal(currentState,isDown){
  currentState.sustainPedalDown=isDown;
  if(isDown)return;

  for(const midi of [...currentState.midiActive]){
    if(!currentState.midiHeld.has(midi)){
      currentState.midiActive.delete(midi);
    }
  }
}

function setMidiAccess(currentState,midiAccess){
  currentState.midiAccess=midiAccess;
}

function setUseFlats(currentState,useFlats){
  currentState.useFlats=useFlats;
}

function updatePianoState(currentState,pianoModel){
  currentState.piano.windowMidi0=pianoModel.windowMidi0;
  currentState.piano.nocts=pianoModel.nocts;
  currentState.piano.translateX=pianoModel.translateX;
}

// === DOM ===

function createDomCache(){
  const elements={};
  for(const [key,id] of Object.entries(AppConfig.domIds)){
    elements[key]=document.getElementById(id);
  }
  elements.pianoWrap=elements.piano.parentElement;
  return elements;
}

const dom=createDomCache();

function updateMidiButton(label,on=false,disabled=false){
  const stateLabel=label||'MIDI';
  dom.midiBtnLabel.textContent='MIDI';
  dom.midiBtn.setAttribute('aria-label',`MIDI ${stateLabel}`);
  dom.midiBtn.title=`MIDI ${stateLabel}`;
  dom.midiBtn.classList.toggle('on',on);
  dom.midiBtn.disabled=disabled;
  dom.midiBtn.dataset.state=
    disabled&&stateLabel==='Unsupported'?'unsupported'
    :stateLabel==='Denied'?'denied'
    :stateLabel==='Live'?'live'
    :stateLabel==='Listening'?'pending'
    :'idle';
}

function updateFlatsButton(useFlats){
  dom.flatBtn.querySelector('.ctl-label').textContent=useFlats?'♭':'♯';
  dom.flatBtn.setAttribute('aria-label',useFlats?'Show sharp note names':'Show flat note names');
}

function isLandscapeViewport(){
  return window.innerWidth>=window.innerHeight;
}

function updateOrientationOverlay(){
  const blocked=!isLandscapeViewport();
  const copy=window.innerWidth<700?'Rotate to landscape':'Widen to landscape';
  dom.orientationCopy.textContent=copy;
  dom.orientationOverlay.classList.toggle('hidden',!blocked);
  dom.orientationOverlay.setAttribute('aria-hidden',String(!blocked));
}

function setChordText(root,symbol,typeClass,typeText){
  const {quality,slashPart}=splitChordSymbol(symbol);

  dom.croot.className='chord-root';
  dom.croot.textContent=root;
  dom.csym.className=`chord-sym${quality?'':' hidden'}`;
  dom.csym.innerHTML=formatChordQualityHtml(quality);
  dom.cslash.className=`chord-slash${slashPart?'':' hidden'}`;
  dom.cslash.textContent=slashPart||'';
  dom.cph.classList.add('hidden');
  dom.ctype.className=`chord-type${typeClass?` ${typeClass}`:''}`;
  dom.ctype.textContent=typeText;
}

function resetChordText(){
  dom.croot.className='chord-root hidden';
  dom.croot.textContent='';
  dom.csym.className='chord-sym hidden';
  dom.csym.textContent='';
  dom.cslash.className='chord-slash hidden';
  dom.cslash.textContent='';
  dom.cph.classList.remove('hidden');
  dom.ctype.className='chord-type';
  dom.ctype.textContent='';
}

// === PianoView ===

function getKeyLeftOffset(keyMeta,dimensions){
  if(keyMeta.isBlack){
    return `${(keyMeta.gWi+1)*dimensions.whiteKeyWidth-dimensions.blackKeyWidth/2}px`;
  }
  return `${keyMeta.gWi*dimensions.whiteKeyWidth}px`;
}

function getKeyboardWidth(dimensions){
  return PianoRange.totalWhiteKeys*dimensions.whiteKeyWidth;
}

function getViewportWidth(dimensions,nocts){
  return dimensions.whiteKeyWidth*7*nocts;
}

function getTranslateBounds(dimensions,nocts){
  const minTranslate=Math.min(0,getViewportWidth(dimensions,nocts)-getKeyboardWidth(dimensions));
  return{minTranslate,maxTranslate:0};
}

function clampTranslateX(translateX,dimensions,nocts){
  const bounds=getTranslateBounds(dimensions,nocts);
  return Math.max(bounds.minTranslate,Math.min(bounds.maxTranslate,translateX));
}

function getTranslateForWindowMidi0(midi0,dimensions,nocts){
  const keyMeta=state.keys.get(midi0)||PianoRange.keys.find(key=>key.midi===midi0);
  const leftOffset=keyMeta?parseFloat(getKeyLeftOffset(keyMeta,dimensions)):0;
  return clampTranslateX(-leftOffset,dimensions,nocts);
}

function getNearestWindowMidi0ForTranslate(translateX,dimensions,nocts){
  const clampedTranslate=clampTranslateX(translateX,dimensions,nocts);
  const starts=getAllowedWindowStarts(nocts);

  return starts.reduce((best,start)=>{
    const bestTranslate=getTranslateForWindowMidi0(best,dimensions,nocts);
    const nextTranslate=getTranslateForWindowMidi0(start,dimensions,nocts);
    return Math.abs(nextTranslate-clampedTranslate)<Math.abs(bestTranslate-clampedTranslate)
      ?start
      :best;
  },starts[0]);
}

function applyPianoDimensions(dimensions){
  dom.piano.style.setProperty('--ww',`${dimensions.whiteKeyWidth}px`);
  dom.piano.style.setProperty('--wh',`${dimensions.whiteKeyHeight}px`);
  dom.piano.style.setProperty('--bw',`${dimensions.blackKeyWidth}px`);
  dom.piano.style.setProperty('--bh',`${dimensions.blackKeyHeight}px`);
  dom.piano.style.width=`${getKeyboardWidth(dimensions)}px`;
  dom.piano.style.height=`${dimensions.whiteKeyHeight}px`;
}

function applyPianoOffset(translateX){
  dom.piano.style.transform=`translate3d(${Math.round(translateX)}px,0,0)`;
}

function createKeyLabel(midi,useFlats){
  const label=document.createElement('div');
  label.className='klabel';
  label.textContent=formatMidiNoteName(midi,useFlats);
  return label;
}

function getMidiAtPoint(clientX,clientY){
  const keyElement=document.elementFromPoint(clientX,clientY)?.closest('.key');
  return keyElement?Number(keyElement.dataset.midi):null;
}

function rebuildPiano(pianoModel,useFlats){
  dom.piano.innerHTML='';
  state.keys.clear();

  const dimensions=getKeyDimensions(pianoModel.nocts,getViewport(),dom.pianoWrap.clientWidth);
  applyPianoDimensions(dimensions);

  for(const key of PianoRange.keys){
    const {midi,isBlack,gWi}=key;
    const keyElement=document.createElement('div');
    const keyMeta={el:keyElement,gWi,isBlack};

    keyElement.className=isBlack?'key black':'key white';
    keyElement.dataset.midi=String(midi);
    keyElement.style.left=getKeyLeftOffset(keyMeta,dimensions);

    if(!isBlack){
      if(getPitchClass(midi)===0||midi===AppConfig.minMidi){
        keyElement.appendChild(createKeyLabel(midi,useFlats));
      }
    }

    dom.piano.appendChild(keyElement);
    state.keys.set(midi,keyMeta);
  }

  const translateX=getTranslateForWindowMidi0(pianoModel.windowMidi0,dimensions,pianoModel.nocts);
  applyPianoOffset(translateX);
  state.piano.translateX=translateX;
}

function resizePianoKeys(pianoModel){
  const dimensions=getKeyDimensions(pianoModel.nocts,getViewport(),dom.pianoWrap.clientWidth);

  for(const [,keyMeta] of state.keys){
    keyMeta.el.style.left=getKeyLeftOffset(keyMeta,dimensions);
  }

  applyPianoDimensions(dimensions);
  const translateX=getTranslateForWindowMidi0(pianoModel.windowMidi0,dimensions,pianoModel.nocts);
  applyPianoOffset(translateX);
  state.piano.translateX=translateX;
}

function renderPianoKeyStates(currentState){
  for(const [midi,keyMeta] of currentState.keys){
    keyMeta.el.classList.toggle('on',isMidiActive(currentState,midi));
  }
}

// === ChordView ===

function renderChordDisplay(displayModel){
  const {activeNotes,chord,noteNames,highlightedRootPc}=displayModel;

  if(activeNotes.length===0){
    resetChordText();
    return;
  }

  if(activeNotes.length===1){
    setChordText(
      noteNames[highlightedRootPc],
      '',
      '',
      `${formatSpokenNoteName(noteNames[highlightedRootPc])} note`
    );
    return;
  }

  if(chord){
    setChordText(
      chord.rootName,
      chord.sym+(chord.slash||''),
      chord.inv?'inv':'known',
      formatChordSubtitle(chord)
    );
    return;
  }

  setChordText('?','','','chord not recognised');
}

function renderNotePills(displayModel){
  const {activeNotes,chord,noteNames,highlightedRootPc}=displayModel;
  const fragment=document.createDocumentFragment();

  dom.pills.innerHTML='';
  dom.pills.classList.toggle('empty',activeNotes.length===0);

  for(const midi of activeNotes){
    const pitchClass=getPitchClass(midi);
    const pill=document.createElement('div');
    let pillClass='neutral';

    if(highlightedRootPc!==null&&pitchClass===highlightedRootPc)pillClass='root';
    else if(chord||activeNotes.length===1)pillClass='note';

    pill.className=`pill ${pillClass}`;
    pill.textContent=noteNames[pitchClass];
    fragment.appendChild(pill);
  }

  dom.pills.appendChild(fragment);
}

function renderAppState(displayModel){
  renderChordDisplay(displayModel);
  renderNotePills(displayModel);
}

function syncAppToState(reason='auto',forceStructure=false){
  const displayModel=getDisplayModel(state,getViewport(),reason,forceStructure);
  updatePianoState(state,displayModel.piano);

  if(displayModel.piano.structureChanged){
    rebuildPiano(displayModel.piano,state.useFlats);
  }else{
    resizePianoKeys(displayModel.piano);
  }

  renderPianoKeyStates(state);
  renderAppState(displayModel);
}

// === MidiController ===

function translateMidiMessage(message){
  const [status,data1,data2]=message.data;
  const command=status&0xf0;

  if(command===0x90&&data2>0){
    if(data1<AppConfig.minMidi||data1>AppConfig.maxMidi)return null;
    return{midi:data1,isHeld:true};
  }

  if(command===0x80||(command===0x90&&data2===0)){
    if(data1<AppConfig.minMidi||data1>AppConfig.maxMidi)return null;
    return{midi:data1,isHeld:false};
  }

  if(command===0xb0&&data1===64){
    return{isSustainPedal:true,isDown:data2>=64};
  }

  return null;
}

function refreshMidiInputs(){
  if(!state.midiAccess)return;

  let inputCount=0;
  for(const input of state.midiAccess.inputs.values()){
    input.onmidimessage=handleMidiMessage;
    inputCount++;
  }

  updateMidiButton(
    inputCount?'Live':'Off',
    inputCount>0,
    false
  );
}

function handleMidiMessage(message){
  const midiChange=translateMidiMessage(message);
  if(!midiChange)return;

  if(midiChange.isSustainPedal){
    setSustainPedal(state,midiChange.isDown);
  }else{
    setMidiHeld(state,midiChange.midi,midiChange.isHeld);
  }

  syncAppToState('midi');
}

function handleMidiStateChange(event){
  if(event.port.type!=='input')return;
  if(event.port.state==='disconnected'){
    clearMidiHeldNotes(state);
    syncAppToState('midi');
  }
  refreshMidiInputs();
}

async function initializeMidi(){
  if(!state.midiSupported){
    updateMidiButton('Unsupported',false,true);
    return;
  }

  if(state.midiAccess){
    refreshMidiInputs();
    return;
  }

  try{
    updateMidiButton('Listening',false,true);
    const midiAccess=await navigator.requestMIDIAccess({sysex:false});
    setMidiAccess(state,midiAccess);
    state.midiAccess.onstatechange=handleMidiStateChange;
    refreshMidiInputs();
  }catch(error){
    updateMidiButton('Denied',false,false);
  }
}

function registerPwa(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol==='file:')return;
  if(!(window.isSecureContext||location.hostname==='localhost'||location.hostname==='127.0.0.1'))return;

  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  },{once:true});
}

// === Interactions ===

function toggleNote(midi){
  toggleManualNote(state,midi);
  syncAppToState('manual');
}

function clearNotes(){
  state.piano.hasManualPan=false;
  clearAllNotes(state);
  syncAppToState('clear');
}

function handleResize(){
  updateOrientationOverlay();
  clearTimeout(state.resizeTimer);
  state.resizeTimer=setTimeout(()=>{
    state.piano.hasManualPan=false;
    syncAppToState('resize',true);
  },AppConfig.resizeDebounceMs);
}

function bindPianoGestures(){
  const interaction={
    pointerId:null,
    startX:0,
    startY:0,
    startTranslateX:0,
    dragging:false,
    panArmed:false,
    startMidi:null,
    panAllowed:true,
    holdTimer:null,
  };

  const clearHoldTimer=()=>{
    if(interaction.holdTimer===null)return;
    clearTimeout(interaction.holdTimer);
    interaction.holdTimer=null;
  };

  const armPanMode=()=>{
    if(!interaction.panAllowed||interaction.pointerId===null||interaction.panArmed)return;
    interaction.panArmed=true;
    dom.pianoWrap.classList.add('dragging');
  };

  const finishPointer=()=>{
    clearHoldTimer();
    interaction.pointerId=null;
    interaction.dragging=false;
    interaction.panArmed=false;
    interaction.startMidi=null;
    interaction.panAllowed=true;
    dom.pianoWrap.classList.remove('dragging');
  };

  dom.pianoWrap.addEventListener('pointerdown',event=>{
    if(interaction.pointerId!==null)return;

    interaction.pointerId=event.pointerId;
    interaction.startX=event.clientX;
    interaction.startY=event.clientY;
    interaction.startTranslateX=state.piano.translateX;
    interaction.dragging=false;
    interaction.panArmed=false;
    interaction.startMidi=event.target.closest('.key')?.dataset.midi??null;
    interaction.panAllowed=state.midiHeld.size===0&&!state.sustainPedalDown;
    clearHoldTimer();
    if(interaction.panAllowed){
      interaction.holdTimer=setTimeout(armPanMode,AppConfig.drag.holdDelayMs);
    }

    dom.pianoWrap.setPointerCapture(event.pointerId);
  });

  dom.pianoWrap.addEventListener('pointermove',event=>{
    if(event.pointerId!==interaction.pointerId)return;

    const deltaX=event.clientX-interaction.startX;
    const deltaY=event.clientY-interaction.startY;
    const absDeltaX=Math.abs(deltaX);
    const absDeltaY=Math.abs(deltaY);

    if(
      !interaction.panArmed
      && interaction.panAllowed
      && absDeltaX>=AppConfig.drag.startDistance
      && absDeltaX>absDeltaY*AppConfig.drag.dominanceRatio
    ){
      armPanMode();
    }

    if(!interaction.panArmed)return;

    event.preventDefault();
    interaction.dragging=true;
    state.piano.hasManualPan=true;
    const dimensions=getKeyDimensions(state.piano.nocts,getViewport(),dom.pianoWrap.clientWidth);
    const nextTranslateX=clampTranslateX(interaction.startTranslateX+deltaX,dimensions,state.piano.nocts);
    applyPianoOffset(nextTranslateX);
    state.piano.translateX=nextTranslateX;
  });

  dom.pianoWrap.addEventListener('pointerup',event=>{
    if(event.pointerId!==interaction.pointerId)return;

    const deltaX=event.clientX-interaction.startX;
    const deltaY=event.clientY-interaction.startY;
    const absDeltaX=Math.abs(deltaX);
    const absDeltaY=Math.abs(deltaY);
    const startedMidi=interaction.startMidi!==null?Number(interaction.startMidi):null;
    const releasedMidi=getMidiAtPoint(event.clientX,event.clientY);
    const wasDragging=interaction.dragging;
    const wasPanArmed=interaction.panArmed;

    if(wasDragging){
      const dimensions=getKeyDimensions(state.piano.nocts,getViewport(),dom.pianoWrap.clientWidth);
      const snappedWindowMidi0=getNearestWindowMidi0ForTranslate(state.piano.translateX,dimensions,state.piano.nocts);
      state.piano.windowMidi0=snappedWindowMidi0;
      state.piano.translateX=getTranslateForWindowMidi0(snappedWindowMidi0,dimensions,state.piano.nocts);
      applyPianoOffset(state.piano.translateX);
      syncAppToState('pan');
    }else if(
      startedMidi!==null
      && releasedMidi===startedMidi
      && absDeltaX<=AppConfig.drag.tapMaxDistance
      && absDeltaY<=AppConfig.drag.tapMaxDistance
    ){
      toggleNote(startedMidi);
    }

    if(dom.pianoWrap.hasPointerCapture(event.pointerId)){
      dom.pianoWrap.releasePointerCapture(event.pointerId);
    }
    finishPointer();
  });

  dom.pianoWrap.addEventListener('pointercancel',event=>{
    if(event.pointerId!==interaction.pointerId)return;
    if(dom.pianoWrap.hasPointerCapture(event.pointerId)){
      dom.pianoWrap.releasePointerCapture(event.pointerId);
    }
    finishPointer();
  });
}

function bindControls(){
  dom.midiBtn.addEventListener('click',initializeMidi);
  dom.flatBtn.addEventListener('click',()=>{
    setUseFlats(state,!state.useFlats);
    updateFlatsButton(state.useFlats);
    syncAppToState('manual',true);
  });
  dom.clrBtn.addEventListener('click',clearNotes);
  window.addEventListener('resize',handleResize);
}

// === Bootstrap ===

function bootstrap(){
  updateFlatsButton(state.useFlats);
  updateOrientationOverlay();
  bindControls();
  bindPianoGestures();

  if(!state.midiSupported){
    updateMidiButton('Unsupported',false,true);
  }else{
    initializeMidi();
  }

  syncAppToState('resize',true);
  registerPwa();
}

bootstrap();
</script>
