<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Chord Detective">
<meta name="theme-color" content="#140804">
<meta name="description" content="Detect chords from the on-screen piano or a connected MIDI keyboard.">
<title>Chord Detective</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#140804;
  --border:rgba(255,177,104,.16);--border-strong:rgba(255,183,102,.3);
  --text:#f2dfcb;--text-soft:#c8a98b;--dim:#8b684f;
  --accent:#ffad52;--accent-strong:#ffbf75;
  --white-pill:rgba(255,202,138,.12);--white-pill-border:rgba(255,183,102,.24);
  --root-pill:linear-gradient(135deg,rgba(255,187,102,.28),rgba(212,122,34,.18));
  --root-pill-border:rgba(255,196,124,.58);
  --note-pill:rgba(255,173,82,.08);--note-pill-border:rgba(255,173,82,.18);
  --shadow:0 24px 60px rgba(0,0,0,.45);
  --glow:0 0 0 1px rgba(255,173,82,.08),0 0 28px rgba(255,126,32,.12);
  --pull:0px;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  touch-action:manipulation}
body{
  background:
    radial-gradient(circle at top,rgba(255,136,40,.13),transparent 28%),
    radial-gradient(circle at bottom,rgba(186,87,16,.1),transparent 32%),
    linear-gradient(180deg,#1d0b05 0%,#110603 48%,#090302 100%);
  overflow-x:hidden;overflow-y:auto;
}
.app{
  display:flex;flex-direction:column;min-height:100dvh;width:100%;
  padding:14px;gap:10px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.01),rgba(255,255,255,0)),
    linear-gradient(90deg,rgba(255,173,82,.03),transparent 18%,transparent 82%,rgba(255,173,82,.03));
  transform:translateY(calc(var(--pull) * .58));
  transition:transform .28s cubic-bezier(.22,.9,.36,1);
  overflow:visible;
  touch-action:manipulation;
}
.app.no-trans,.app.pull-live{transition:none}
.app.pull-snap{transition:transform .32s cubic-bezier(.22,.9,.36,1)}
.pull-indicator{
  position:fixed;top:10px;left:50%;
  transform:translateX(-50%) translateY(calc(-100% + var(--pull)));
  width:46px;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  background:rgba(30,14,8,.92);border:1px solid rgba(255,196,124,.24);box-shadow:var(--shadow),var(--glow);
  opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease,border-color .15s ease,box-shadow .15s ease;
  z-index:30;
}
.pull-indicator.active{opacity:1}
.pull-indicator.armed{border-color:rgba(255,196,124,.7);box-shadow:var(--shadow),var(--glow),0 0 22px rgba(255,148,41,.22)}
@keyframes pull-spin{to{transform:rotate(360deg)}}
.pull-indicator svg{
  width:24px;height:24px;display:block;
  transform:rotate(var(--pull-rotate,0deg));
  transition:transform .04s linear;
}
.pull-indicator.spinning svg{animation:pull-spin .5s cubic-bezier(.4,0,.2,1) forwards}
.pull-indicator path{
  stroke:var(--accent-strong);stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 10px rgba(255,148,41,.18));
  transition:stroke .15s ease;
}
.pull-indicator.armed path{stroke:var(--accent)}
.topbar{display:flex;flex-direction:column;gap:8px}
header{
  display:flex;align-items:center;gap:8px;
  padding:0 14px;height:52px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(34,16,10,.94),rgba(19,10,7,.92));
  border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow),var(--glow);
  backdrop-filter:blur(14px);
}
.brand{font-size:11px;color:var(--text-soft);letter-spacing:.08em;white-space:nowrap;text-transform:uppercase}
.brand b{color:var(--accent-strong);font-weight:700}
.sep{width:1px;height:18px;background:var(--border);flex-shrink:0;margin-right:auto}
.controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
.notes-strip{
  display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:10px;min-height:56px;padding:10px 14px;
  background:linear-gradient(180deg,rgba(34,16,10,.86),rgba(19,10,7,.84));
  border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow),var(--glow);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  touch-action:pan-x; /* override body touch-action:none so pills are horizontally scrollable on touch */
}
.notes-strip::-webkit-scrollbar{display:none}
.notes-strip.empty{align-items:center}
.notes-strip.empty::before{
  content:'No notes selected';
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);
}
.pill{
  min-height:36px;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap;flex-shrink:0;letter-spacing:.05em;
  border:1px solid var(--white-pill-border);background:var(--white-pill);color:var(--text-soft);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;
}
.pill.root{
  background:var(--root-pill);border-color:var(--root-pill-border);color:#fff3e4;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 18px rgba(255,148,41,.15);
}
.pill.note{background:var(--note-pill);border-color:var(--note-pill-border);color:var(--accent-strong)}
.pill.neutral{color:var(--text-soft)}
.clear{
  background:linear-gradient(180deg,rgba(255,176,88,.24),rgba(187,99,26,.18));border:1px solid var(--border-strong);color:#fff2e4;
  padding:6px 13px;border-radius:999px;font-family:inherit;font-size:10px;cursor:pointer;
  white-space:nowrap;flex-shrink:0;transition:border-color .12s,box-shadow .12s,background .12s,transform .12s;letter-spacing:.06em;text-transform:uppercase
}
.clear:hover{border-color:rgba(255,196,124,.6);box-shadow:0 0 18px rgba(255,148,41,.14)}
.clear:active{transform:translateY(1px);background:linear-gradient(180deg,rgba(255,188,114,.4),rgba(196,104,29,.26))}
.midi-btn{
  background:rgba(255,173,82,.08);border:1px solid var(--border);color:var(--text-soft);
  padding:6px 12px;border-radius:999px;font-family:inherit;font-size:10px;cursor:pointer;
  white-space:nowrap;transition:border-color .12s,color .12s,box-shadow .12s,transform .12s;letter-spacing:.06em;text-transform:uppercase
}
.midi-btn:hover{border-color:rgba(255,196,124,.6);color:var(--accent-strong)}
.midi-btn:active{transform:translateY(1px)}
.midi-btn.on{
  background:linear-gradient(180deg,rgba(255,176,88,.24),rgba(187,99,26,.18));
  border-color:var(--border-strong);color:#fff2e4;
  box-shadow:0 0 18px rgba(255,148,41,.14)
}
.midi-btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.chord-zone{
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:22px 18px 18px;
  position:relative;min-height:178px;
  border:1px solid var(--border);border-radius:28px;
  background:
    radial-gradient(circle at top center,rgba(255,160,64,.2),transparent 34%),
    linear-gradient(180deg,rgba(10,4,2,.96),rgba(20,10,6,.94));
  box-shadow:var(--shadow),var(--glow);
  overflow:hidden;
}
.chord-zone::after{
  content:'';position:absolute;left:14%;right:14%;bottom:12px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,173,82,.35),transparent);
  opacity:.7;pointer-events:none;
}
.chord-main{display:flex;align-items:flex-end;gap:2px;line-height:1;position:relative;z-index:1}
.chord-root{
  font-size:80px;font-weight:700;color:var(--accent-strong);
  letter-spacing:-.03em;line-height:.88;
  text-shadow:0 0 26px rgba(255,155,56,.16);
  transition:opacity .2s,transform .2s;
}
.chord-sym{
  font-size:34px;font-weight:600;color:var(--accent-strong);
  padding-bottom:9px;letter-spacing:.01em;
  text-shadow:0 0 22px rgba(255,155,56,.15);
  transition:opacity .2s;
}
/* #7: renamed .empty to .hidden to avoid collision with .notes-strip.empty */
.hidden{opacity:0;pointer-events:none}
.chord-ph{
  font-size:13px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  white-space:nowrap;
}
.chord-type{
  margin-top:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);min-height:15px;text-align:center;position:relative;z-index:1;
  transition:color .15s;
}
.chord-type.known{color:var(--text)}
.chord-type.inv{color:var(--accent)}
.piano-wrap{display:flex;align-items:center;justify-content:center;
  flex:1 1 auto;
  padding:16px 40px 12px;overflow:hidden;border:1px solid var(--border);border-radius:30px;
  background:linear-gradient(180deg,rgba(33,15,10,.92),rgba(14,7,5,.96));
  box-shadow:var(--shadow),var(--glow);
  position:relative}
.oct-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  width:28px;height:48px;border-radius:8px;border:1px solid var(--border);
  background:rgba(20,10,6,.82);color:var(--text-soft);font-size:14px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;flex-shrink:0;
  transition:background .12s,border-color .12s,color .12s,opacity .15s;
  opacity:.7;touch-action:none;
}
.oct-btn:hover{background:rgba(40,20,10,.92);border-color:var(--border-strong);color:var(--accent-strong);opacity:1}
.oct-btn:active{background:rgba(60,30,12,.95);color:var(--accent)}
.oct-btn.disabled{opacity:.2;pointer-events:none}
.oct-btn-l{left:6px}
.oct-btn-r{right:6px}
/* Piano key sizing via CSS vars — resizeKeys() updates them; CSS transitions handle smooth resize */
#piano{
  position:relative;filter:drop-shadow(0 18px 28px rgba(0,0,0,.36));max-width:100%;
  --ww:33px;--wh:172px;--bw:20px;--bh:110px;
  transition:width .12s ease,height .12s ease;
}
.key{position:absolute;top:0;cursor:pointer;border-radius:0 0 4px 4px;touch-action:none}
.key.white{
  width:var(--ww);height:var(--wh);
  background:linear-gradient(180deg,#fff5e7 0%,#eed8bc 55%,#e0c5a3 100%);
  border:1px solid rgba(106,74,52,.45);border-top:none;z-index:1;
  transition:background .18s ease,box-shadow .18s ease,filter .18s ease,
             width .12s ease,height .12s ease,left .12s ease
}
.key.white:hover{background:linear-gradient(180deg,#fff7ea 0%,#f3e0c6 58%,#e6cbab 100%);filter:saturate(1.02)}
.key.white.on{background:linear-gradient(180deg,#ffc879 0%,#f1a24b 60%,#d47a22 100%);border-color:rgba(120,69,27,.62);box-shadow:inset 0 0 0 1px rgba(255,244,226,.28)}
.key.black{
  width:var(--bw);height:var(--bh);
  background:linear-gradient(180deg,#31160d 0%,#1a0a06 100%);border:1px solid #090402;border-top:none;
  box-shadow:0 8px 14px rgba(0,0,0,.72),inset 0 -1px 0 rgba(255,255,255,.06);z-index:2;
  transition:background .18s ease,box-shadow .18s ease,filter .18s ease,
             width .12s ease,height .12s ease,left .12s ease
}
.key.black:hover{background:linear-gradient(180deg,#3a1a10 0%,#24100a 100%);filter:brightness(1.05)}
.key.black.on{background:linear-gradient(180deg,#e18d37 0%,#af5b16 100%);box-shadow:0 4px 7px rgba(0,0,0,.5),0 0 22px rgba(255,133,29,.22)}
.klabel{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  font-size:8px;color:#7f654d;pointer-events:none;letter-spacing:.06em;text-transform:uppercase}
.key.white.on .klabel{color:#381c07;font-weight:700}
.key.black .klabel,.key.black.on .klabel{display:none}
footer{
  min-height:32px;background:linear-gradient(180deg,rgba(31,14,9,.94),rgba(18,8,6,.94));border:1px solid var(--border);
  border-radius:16px;display:flex;align-items:center;padding:0 12px;
  font-size:10px;color:var(--dim);flex-shrink:0;gap:12px;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:var(--shadow),var(--glow)
}
footer .hi{color:var(--accent-strong)}
footer .sp{opacity:.25}
.ver{
  margin-left:auto;
  font-size:9px;
  color:rgba(255,191,117,.72);
  letter-spacing:.1em;
  white-space:nowrap;
}
@media (max-width:720px){
  .app{padding:10px;gap:8px}
  .topbar{gap:6px}
  header{height:48px;padding:0 12px}
  .chord-zone{min-height:154px;padding:20px 14px 16px}
  .chord-root{font-size:64px}
  .chord-sym{font-size:28px;padding-bottom:7px}
  .pill{min-height:32px;padding:7px 14px;font-size:12px}
  .controls{gap:6px}
  .midi-btn,.clear{padding:6px 10px;font-size:9px}
  .notes-strip{gap:8px;padding:8px 10px;min-height:48px}
  footer{font-size:9px;gap:8px}
}

@media (max-width:430px){
  header{
    height:auto;
    padding:10px 12px;
    flex-direction:column;
    align-items:stretch;
    gap:10px;
  }
  .brand{
    white-space:normal;
    text-align:center;
  }
  .sep{display:none}
  .controls{
    width:100%;
    justify-content:center;
    flex-wrap:wrap;
  }
  .midi-btn,.clear{
    flex:1 1 140px;
    min-width:0;
  }
}

/* chord-inner: wraps the chord name + type; in portrait the chord-zone flips to row */
.chord-inner{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;z-index:1;flex:1 1 auto;
}
/* Portrait-only clear button — hidden by default, shown in portrait via media query */
.portrait-clear{
  display:none;
  background:rgba(255,173,82,.10);border:1px solid var(--border);color:var(--text-soft);
  border-radius:10px;font-family:inherit;font-size:16px;cursor:pointer;
  padding:6px 10px;flex-shrink:0;align-self:center;
  transition:background .12s,border-color .12s;
}
.portrait-clear:active{background:rgba(255,173,82,.22);border-color:var(--border-strong)}

/* ============================================================
   PORTRAIT PHONE — compact layout tweaks only.
   Keep the full UI visible; do not hide sections based on screen size.
   ============================================================ */
@media (max-width:520px) and (orientation:portrait){
  html,body{height:auto;min-height:100%}
  body{overflow-y:auto;overflow-x:hidden}

  /* Tighten app container */
  .app{
    height:auto;
    min-height:100dvh;
    overflow:visible;
    touch-action:manipulation;
    padding:6px;gap:5px
  }

  /* Notes strip: slim single-line row of pills */
  .topbar{gap:4px}
  .notes-strip{
    min-height:32px;max-height:40px;padding:4px 10px;gap:6px;
    border-radius:12px;
  }
  .notes-strip.empty::before{font-size:9px}
  .pill{min-height:24px;padding:4px 11px;font-size:11px;border-radius:999px}

  /* Chord zone: row layout — name on left, clear button on right */
  .chord-zone{
    min-height:0;
    flex-shrink:0;
    padding:5px 10px 5px 14px;
    border-radius:16px;
    flex-direction:row;       /* override column default */
    align-items:center;
    justify-content:flex-start;
    gap:8px;
  }
  .chord-zone::after{display:none}
  .chord-inner{align-items:flex-start;flex-direction:row;align-items:center;gap:4px}
  .chord-ph{font-size:10px;letter-spacing:.08em;position:static;transform:none}
  .chord-main{line-height:1}

  /* Chord name: compact but still readable */
  .chord-root{font-size:36px;line-height:1}
  .chord-sym{font-size:17px;padding-bottom:2px}

  /* Piano wrap: all remaining space */
  .piano-wrap{
    flex:1 1 auto;
    min-height:0;
    padding:8px 6px 6px;
    border-radius:20px;
  }
}

/* Very short portrait (iPhone SE ~667px, older androids) */
@media (max-width:520px) and (max-height:680px) and (orientation:portrait){
  .chord-root{font-size:28px}
  .chord-sym{font-size:14px;padding-bottom:3px}
  .chord-zone{padding:4px 10px 4px}
  .notes-strip{min-height:26px;max-height:32px;padding:3px 8px}
  .pill{min-height:20px;padding:3px 9px;font-size:10px}
  .app{gap:4px;padding:5px}
}
</style>
</head>
<body>
<div class="pull-indicator" id="pullIndicator" aria-hidden="true">
  <svg viewBox="0 0 24 24" role="presentation">
    <path d="M17 8a7 7 0 1 0 1.7 7.1"></path>
    <path d="M18 5v5h-5"></path>
  </svg>
</div>
<div class="app no-trans" id="app">
<div class="topbar">
  <header>
    <div class="brand">🎹 <b>Chord</b> Detective</div>
    <div class="sep"></div>
    <div class="controls">
      <button type="button" class="midi-btn" id="midiBtn" aria-label="Connect MIDI device">MIDI connect</button>
      <button type="button" class="clear" id="clrBtn" aria-label="Clear all notes">⌫ clear</button>
    </div>
  </header>
  <div class="notes-strip" id="pills"></div>
</div>
<div class="chord-zone">
  <!-- chord-inner: in portrait becomes a flex row: [name] [spacer] [clear btn] -->
  <div class="chord-inner">
    <div class="chord-ph" id="cph">tap keys to start</div>
    <div class="chord-main">
      <div class="chord-root hidden" id="croot"></div>
      <div class="chord-sym hidden" id="csym"></div>
    </div>
    <div class="chord-type" id="ctype"></div>
  </div>
  <!-- portrait-only clear button, hidden on desktop via CSS -->
  <button type="button" class="portrait-clear" id="portraitClrBtn" aria-label="Clear all notes">⌫</button>
</div>
<div class="piano-wrap">
  <button type="button" class="oct-btn oct-btn-l" id="octDn" aria-label="Shift piano down one octave">&#8249;</button>
  <div id="piano"></div>
  <button type="button" class="oct-btn oct-btn-r" id="octUp" aria-label="Shift piano up one octave">&#8250;</button>
</div>
<footer>
  <span id="fmsg">ready</span>
  <span class="sp">|</span>
  <span id="frange">C3 – B4</span>
  <span class="sp">|</span>
  <span id="fnotes" class="hi">0 notes</span>
  <span id="ver" class="ver">v bac6677-dev</span>
</footer>
</div>
<script>
// === MUSIC ENGINE ===

const PATTERNS=[
  {s:'5',  n:'Power chord',          i:[0,7]},
  {s:'',   n:'Major',                i:[0,4,7]},
  {s:'m',  n:'Minor',                i:[0,3,7]},
  {s:'°',  n:'Diminished',           i:[0,3,6]},
  {s:'+',  n:'Augmented',            i:[0,4,8]},
  {s:'sus2',n:'Suspended 2nd',       i:[0,2,7]},
  {s:'sus4',n:'Suspended 4th',       i:[0,5,7]},
  {s:'maj7',n:'Major 7th',           i:[0,4,7,11]},
  {s:'m7', n:'Minor 7th',            i:[0,3,7,10]},
  {s:'7',  n:'Dominant 7th',         i:[0,4,7,10]},
  {s:'°7', n:'Diminished 7th',       i:[0,3,6,9]},
  {s:'ø7', n:'Half-diminished',      i:[0,3,6,10]},
  {s:'mM7',n:'Minor major 7th',      i:[0,3,7,11]},
  {s:'+M7',n:'Augmented major 7th',  i:[0,4,8,11]},
  {s:'+7', n:'Augmented 7th',        i:[0,4,8,10]},
  {s:'6',  n:'Major 6th',            i:[0,4,7,9]},
  {s:'m6', n:'Minor 6th',            i:[0,3,7,9]},
  {s:'add9',n:'Add 9',               i:[0,2,4,7]},
  {s:'madd9',n:'Minor add 9',        i:[0,2,3,7]},
  {s:'7sus4',n:'Dominant 7 sus4',    i:[0,5,7,10]},
  {s:'9',  n:'Dominant 9th',         i:[0,2,4,7,10]},
  {s:'maj9',n:'Major 9th',           i:[0,2,4,7,11]},
  {s:'m9', n:'Minor 9th',            i:[0,2,3,7,10]},
  {s:'6/9',n:'Six-nine',             i:[0,2,4,7,9]},
];

const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

// Semitone layout within one octave: {semi, isBlack, whiteIndex}
const OCT=[
  {semi:0, isBlack:false, wi:0},{semi:1, isBlack:true,  wi:0},
  {semi:2, isBlack:false, wi:1},{semi:3, isBlack:true,  wi:1},
  {semi:4, isBlack:false, wi:2},
  {semi:5, isBlack:false, wi:3},{semi:6, isBlack:true,  wi:3},
  {semi:7, isBlack:false, wi:4},{semi:8, isBlack:true,  wi:4},
  {semi:9, isBlack:false, wi:5},{semi:10,isBlack:true,  wi:5},
  {semi:11,isBlack:false, wi:6},
];
const BLACK_SEMIS=new Set([1,3,6,8,10]);

function formatMidiName(midi){
  return `${NAMES[((midi%12)+12)%12]}${Math.floor(midi/12)-1}`;
}

function detect(midis){
  if(midis.length<2)return null;
  const pcs=[...new Set(midis.map(n=>((n%12)+12)%12))].sort((a,b)=>a-b);
  // BUG FIX: try the bass note's pitch class as root first so that, e.g.,
  // A-C-E-G identifies as Am7 (bass=A is root) rather than C6/A (C tried first
  // because 0 < 9 in ascending-sorted pcs order).
  const bassPC=((Math.min(...midis)%12)+12)%12;
  const tryOrder=[bassPC,...pcs.filter(p=>p!==bassPC)];
  for(const root of tryOrder){
    const iv=pcs.map(p=>(p-root+12)%12).sort((a,b)=>a-b);
    const m=PATTERNS.find(p=>p.i.length===iv.length&&p.i.every((v,i)=>v===iv[i]));
    if(m){
      const inv=bassPC!==root;
      return{root:NAMES[root],sym:m.s,name:m.n,slash:inv?'/'+NAMES[bassPC]:'',inv};
    }
  }
  return null;
}

// === STATE ===

const MIN_MIDI=21, MAX_MIDI=108;

const state={
  manual:new Set(),   // notes toggled by clicking the piano
  midi:new Set(),     // notes held via MIDI input
  // BUG FIX: use Map (consistent with state.keyMeta; avoids string-key coercion
  // in Object.entries and the +midi cast that was needed in updateKeyStates)
  keys:new Map(),     // midi -> DOM element map, rebuilt on each build()
  keyMeta:new Map(),  // midi -> {gWi, isBlack} layout data for resizeKeys()
  piano:{defaultMidi0:48,windowMidi0:48,nocts:2,last:71},
  midiAccess:null,
  midiSupported:'requestMIDIAccess' in navigator,
  pull:{active:false,armed:false,startY:0,dist:0,pointerId:null,input:'',touchId:null},
  resizeTimer:null,
};

function activeNotes(){
  return [...new Set([...state.manual,...state.midi])].sort((a,b)=>a-b);
}

// === CACHED DOM REFS ===
// #2: resolve once, never query inside hot paths
const dom={
  pills:    document.getElementById('pills'),
  croot:    document.getElementById('croot'),
  csym:     document.getElementById('csym'),
  cph:      document.getElementById('cph'),
  ctype:    document.getElementById('ctype'),
  fmsg:     document.getElementById('fmsg'),
  frange:   document.getElementById('frange'),
  fnotes:   document.getElementById('fnotes'),
  piano:    document.getElementById('piano'),
  midiBtn:  document.getElementById('midiBtn'),
  // BUG FIX: was queried via getElementById at init instead of being cached here
  clrBtn:   document.getElementById('clrBtn'),
  pullInd:  document.getElementById('pullIndicator'),
  app:      document.getElementById('app'),
  octDn:        document.getElementById('octDn'),
  octUp:        document.getElementById('octUp'),
  portraitClr:  document.getElementById('portraitClrBtn'),
};

// === MIDI UI ===

function updateMidiButton(label,on=false,disabled=false){
  dom.midiBtn.textContent=label;
  dom.midiBtn.classList.toggle('on',on);
  dom.midiBtn.disabled=disabled;
}

function updateConnectivityStatus(){
  if(!navigator.onLine&&activeNotes().length===0&&!state.midi.size){
    dom.fmsg.textContent='offline ready';
  }else if(navigator.onLine&&activeNotes().length===0){
    dom.fmsg.textContent='ready';
  }
}

// === PIANO LAYOUT ===

function getVisibleOctaves(width){
  if(width<520)return 2;
  if(width<860)return 3;
  if(width<1260)return 4;
  return 5;
}

function getDefaultMidi0(width){
  return width<1260?48:36;
}

function clampWindowMidi0(midi0,nocts){
  const span=Math.max(12,nocts*12);
  // The builder now supports the real A0/B0 lead-in, so the lowest window can
  // start at A0 while normal windows still snap to octave boundaries.
  const maxStart=Math.max(MIN_MIDI,MAX_MIDI-span+1);
  const octaveAligned=Math.round(midi0/12)*12;
  if(midi0<=MIN_MIDI)return MIN_MIDI;
  return Math.max(MIN_MIDI,Math.min(octaveAligned,maxStart));
}

function getCenteredWindowMidi0(notes,nocts,currentMidi0){
  if(!notes.length)return clampWindowMidi0(currentMidi0,nocts);
  const min=Math.min(...notes),max=Math.max(...notes);
  const span=nocts*12;
  const currentStart=clampWindowMidi0(currentMidi0,nocts);
  if(min>=currentStart&&max<=currentStart+span-1)return currentStart;

  const unclampedIdeal=(min+max)/2-span/2+6;
  const centeredStart=clampWindowMidi0(unclampedIdeal,nocts);
  if(max-min+1>span)return centeredStart;

  const maxStart=Math.max(MIN_MIDI,MAX_MIDI-span+1);
  const starts=[];
  // Candidates must be C-aligned (multiples of 12); MIN_MIDI=21 is A, so start from C1=24
  const C1=Math.ceil(MIN_MIDI/12)*12;
  for(let s=C1;s<=maxStart;s+=12){
    if(s>=Math.max(MIN_MIDI,max-span+1)&&s<=Math.min(maxStart,min))starts.push(s);
  }
  if(!starts.length)return centeredStart;
  return starts.reduce((best,s)=>Math.abs(s-unclampedIdeal)<Math.abs(best-unclampedIdeal)?s:best,starts[0]);
}

// === PIANO BUILD ===

// Compute key dimensions from available space — returns {wW, wH, bW, bH}
function keyDims(nocts){
  const wrap=dom.piano.parentElement;
  const isPortrait=window.innerWidth<520&&window.innerHeight>window.innerWidth;
  const wW=Math.min((wrap.clientWidth-8)/(7*nocts),78); // float — CSS handles sub-pixel
  const maxWH=Math.min(window.innerHeight*(isPortrait?.30:.58),430);
  const wH=Math.max(isPortrait?120:220,Math.min(wW*5.2,maxWH));
  return{wW,wH,bW:wW*.6,bH:wH*.64};
}

// Set CSS variable sizes on #piano — keys scale via CSS transition, no DOM rebuild
function resizeKeys(nocts){
  const{wW,wH,bW,bH}=keyDims(nocts);
  const p=dom.piano;
  // Both maps are always in sync (built together); iterate keys directly
  for(const[midi,el] of state.keys){
    const meta=state.keyMeta.get(midi);
    el.style.left=meta.isBlack
      ?`${(meta.gWi+1)*wW-bW/2}px`
      :`${meta.gWi*wW}px`;
  }
  // Update CSS vars so width/height transitions animate on all keys
  p.style.setProperty('--ww',`${wW}px`);
  p.style.setProperty('--wh',`${wH}px`);
  p.style.setProperty('--bw',`${bW}px`);
  p.style.setProperty('--bh',`${bH}px`);
  p.style.width=`${wW*7*nocts}px`;
  p.style.height=`${wH}px`;
}

// Full rebuild — only called when octave count or window position changes
function build(){
  dom.piano.innerHTML='';
  state.keys.clear();
  state.keyMeta=new Map();
  const{windowMidi0:midi0,nocts}=state.piano;
  const{wW,wH,bW,bH}=keyDims(nocts);
  const p=dom.piano;
  p.style.setProperty('--ww',`${wW}px`);
  p.style.setProperty('--wh',`${wH}px`);
  p.style.setProperty('--bw',`${bW}px`);
  p.style.setProperty('--bh',`${bH}px`);
  p.style.width=`${wW*7*nocts}px`;
  p.style.height=`${wH}px`;

  // Build from the actual visible MIDI range so the special low-end A0/B0 lead-in
  // can appear before the first C-based octave without misplacing key labels.
  let whiteIndex=0;
  const midiEnd=Math.min(midi0+nocts*12-1,MAX_MIDI);
  for(let midi=midi0;midi<=midiEnd;midi++){
    const pc=((midi%12)+12)%12;
    const isBlack=BLACK_SEMIS.has(pc);
    const gWi=isBlack?Math.max(0,whiteIndex-1):whiteIndex;
    const el=document.createElement('div');
    if(isBlack){
      el.className='key black';
      el.style.left=`${(gWi+1)*wW-bW/2}px`;
    }else{
      el.className='key white';
      el.style.left=`${gWi*wW}px`;
      if(pc===0||midi===MIN_MIDI){
        const lb=document.createElement('div');
        lb.className='klabel';
        lb.textContent=formatMidiName(midi);
        el.appendChild(lb);
      }
      whiteIndex++;
    }
    el.addEventListener('pointerdown',e=>{e.preventDefault();toggle(midi);});
    p.appendChild(el);
    state.keys.set(midi,el);
    state.keyMeta.set(midi,{gWi,isBlack});
  }
  updateKeyStates();
}

function updateKeyStates(){
  const active=new Set([...state.manual,...state.midi]);
  // BUG FIX: state.keys is now a Map so keys are already numbers — no +midi cast needed
  for(const[midi,el] of state.keys){
    el.classList.toggle('on',active.has(midi));
  }
}

function update(force=false){
  const notes=activeNotes();
  const nocts=getVisibleOctaves(window.innerWidth);
  const defaultMidi0=getDefaultMidi0(window.innerWidth);
  const nextMidi0=notes.length
    ?getCenteredWindowMidi0(notes,nocts,state.piano.windowMidi0)
    :clampWindowMidi0(state.piano.windowMidi0??defaultMidi0,nocts);
  // defaultMidi0 only matters when no notes are held (it's the fallback window position).
  // Once windowMidi0 is set it drives nextMidi0 directly, so defaultMidi0 can never
  // change the layout independently — including it in structureChanged caused spurious
  // full DOM rebuilds when crossing the 1260px breakpoint while notes were held.
  const structureChanged=force
    ||state.piano.nocts!==nocts
    ||state.piano.windowMidi0!==nextMidi0;
  state.piano.defaultMidi0=defaultMidi0;
  state.piano.windowMidi0=nextMidi0;
  state.piano.nocts=nocts;
  state.piano.last=nextMidi0+nocts*12-1;
  dom.frange.textContent=`${formatMidiName(nextMidi0)} – ${formatMidiName(state.piano.last)}`;
  if(structureChanged){build();updateOctBtns();}
  else updateKeyStates();
  render(notes);
}

// On resize: immediately reposition keys via CSS vars (smooth),
// then debounce a full rebuild for octave count changes
function onResize(){
  const nocts=getVisibleOctaves(window.innerWidth);
  if(nocts!==state.piano.nocts){
    // Octave count changes require a full DOM rebuild — debounce it
    clearTimeout(state.resizeTimer);
    state.resizeTimer=setTimeout(()=>update(),120);
  }else{
    // Same octave count — just reflow key positions and CSS var sizes smoothly
    resizeKeys(nocts);
  }
}

// === RENDER ===

function render(notes=activeNotes()){
  let detectedRoot=null,detected=null;

  dom.pills.innerHTML='';
  dom.pills.classList.toggle('empty',notes.length===0);
  dom.fnotes.textContent=notes.length+(notes.length===1?' note':' notes');

  if(notes.length===0){
    // #7: use .hidden instead of .empty on chord display elements
    dom.croot.className='chord-root hidden';dom.croot.textContent='';
    dom.csym.className='chord-sym hidden';dom.csym.textContent='';
    dom.cph.classList.remove('hidden');
    dom.ctype.className='chord-type';dom.ctype.textContent='';
    dom.fmsg.textContent='ready';
  }else if(notes.length===1){
    const pc=((notes[0]%12)+12)%12;
    detectedRoot=pc;
    dom.croot.className='chord-root';dom.croot.textContent=NAMES[pc];
    dom.csym.className='chord-sym hidden';dom.csym.textContent='';
    dom.cph.classList.add('hidden');
    dom.ctype.className='chord-type';dom.ctype.textContent='add more notes...';
    dom.fmsg.textContent='keep adding notes';
  }else{
    detected=detect(notes);
    dom.cph.classList.add('hidden');
    if(detected){
      detectedRoot=NAMES.indexOf(detected.root);
      dom.croot.className='chord-root';dom.croot.textContent=detected.root;
      dom.csym.className='chord-sym';dom.csym.textContent=detected.sym+(detected.slash||'');
      dom.ctype.className='chord-type'+(detected.inv?' inv':' known');
      dom.ctype.textContent=detected.name+(detected.inv?' - inversion':'');
      dom.fmsg.textContent=detected.root+detected.sym+(detected.slash||'')+' · '+detected.name;
    }else{
      dom.croot.className='chord-root';dom.croot.textContent='?';
      dom.csym.className='chord-sym hidden';dom.csym.textContent='';
      dom.ctype.className='chord-type';dom.ctype.textContent='chord not recognised';
      dom.fmsg.textContent='unknown chord';
    }
  }

  const frag=document.createDocumentFragment();
  for(const m of notes){
    const pc=((m%12)+12)%12;
    const p=document.createElement('div');
    let cls='neutral';
    if(detectedRoot!==null&&pc===detectedRoot)cls='root';
    else if(detected||notes.length===1)cls='note';
    p.className='pill '+cls;
    p.textContent=NAMES[pc];
    frag.appendChild(p);
  }
  dom.pills.appendChild(frag);
}

// === OCTAVE NAVIGATION ===

function shiftWindow(delta){
  // delta: +12 = one octave up, -12 = one octave down
  const nocts=state.piano.nocts;
  const next=clampWindowMidi0(state.piano.windowMidi0+delta,nocts);
  if(next===state.piano.windowMidi0)return; // already at limit
  state.piano.windowMidi0=next;
  state.piano.last=next+nocts*12-1;
  dom.frange.textContent=`${formatMidiName(next)} – ${formatMidiName(state.piano.last)}`;
  build();
  updateOctBtns();
}

function updateOctBtns(){
  const nocts=state.piano.nocts;
  const atMin=clampWindowMidi0(state.piano.windowMidi0-12,nocts)===state.piano.windowMidi0;
  const atMax=clampWindowMidi0(state.piano.windowMidi0+12,nocts)===state.piano.windowMidi0;
  dom.octDn.classList.toggle('disabled',atMin);
  dom.octUp.classList.toggle('disabled',atMax);
}

// Swipe on the piano wrap to shift octaves
(function(){
  const wrap=document.querySelector('.piano-wrap');
  let sx=0,sy=0,pid=null,moved=false;
  const SWIPE_MIN=40; // px horizontal to count as swipe
  const TAP_MAX=10;   // px — if moved less than this it's a tap, not a swipe

  wrap.addEventListener('pointerdown',e=>{
    // Only track the first touch; ignore if it lands on a key or nav button
    if(pid!==null)return;
    if(e.target.closest('.key')||e.target.closest('.oct-btn'))return;
    pid=e.pointerId; sx=e.clientX; sy=e.clientY; moved=false;
  },{passive:true});

  wrap.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid)return;
    if(Math.abs(e.clientX-sx)>TAP_MAX||Math.abs(e.clientY-sy)>TAP_MAX)moved=true;
  },{passive:true});

  wrap.addEventListener('pointerup',e=>{
    if(e.pointerId!==pid)return;
    pid=null;
    if(!moved)return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    // Must be more horizontal than vertical, and exceed threshold
    if(Math.abs(dx)>SWIPE_MIN&&Math.abs(dx)>Math.abs(dy)*1.4){
      shiftWindow(dx<0?12:-12); // swipe left = higher octave, swipe right = lower
    }
  },{passive:true});

  wrap.addEventListener('pointercancel',()=>{pid=null;},{passive:true});

  // Preserve normal page scrolling. Hold Alt while wheeling over the piano to
  // shift octaves without scrolling the document.
  wrap.addEventListener('wheel',e=>{
    if(!e.altKey)return;
    e.preventDefault();
    shiftWindow(e.deltaY>0?12:-12);
  },{passive:false});
})();

// === PIANO INTERACTION ===

function toggle(midi){
  if(state.manual.has(midi))state.manual.delete(midi);
  else state.manual.add(midi);
  update();
}

// === PULL-TO-REFRESH ===

const PULL_MAX=88;       // max visual pull distance (px)
const PULL_ARM=0.78;     // fraction of PULL_MAX to trigger armed state
const PULL_SNAP_MS=320;  // must match .app.pull-snap transition duration

// Rubber-band easing: fast start, asymptotically approaches PULL_MAX
function rubberBand(raw){
  return PULL_MAX*(1-Math.exp(-raw/PULL_MAX));
}

function setPullDistance(px){
  document.documentElement.style.setProperty('--pull',`${px.toFixed(2)}px`);
}

function setPullRotation(fraction){
  // Rotate icon 0→180deg as pull progresses, snaps to 360 when armed
  const deg=state.pull.armed?180:fraction*180;
  dom.pullInd.style.setProperty('--pull-rotate',`${deg.toFixed(1)}deg`);
}

function resetPull(){
  Object.assign(state.pull,{active:false,armed:false,startY:0,dist:0,pointerId:null,input:'',touchId:null});
  // Re-enable app transition BEFORE zeroing --pull so snap-back animates
  dom.app.classList.remove('pull-live');
  dom.app.classList.add('pull-snap');
  requestAnimationFrame(()=>{
    setPullDistance(0);
    dom.pullInd.classList.remove('active','armed');
    dom.pullInd.style.setProperty('--pull-rotate','0deg');
    // Remove pull-snap after animation completes
    setTimeout(()=>dom.app.classList.remove('pull-snap'),PULL_SNAP_MS+30);
  });
}

function isCompactPortraitPhone(){
  return window.matchMedia('(max-width:520px) and (orientation:portrait)').matches;
}

function isWithinTopThird(y){
  return y<=window.innerHeight/3;
}

function isExcludedPullTarget(target){
  return !!(target.closest('#piano')
    || target.closest('button')
    || target.closest('.notes-strip'));
}

function shouldStartPull(e){
  if(isCompactPortraitPhone()&&e.pointerType==='touch')return false;
  if(isCompactPortraitPhone()){
    return window.scrollY===0
      &&isWithinTopThird(e.clientY)
      &&!isExcludedPullTarget(e.target);
  }
  // Exclude the pill strip: it has touch-action:pan-x so horizontal drags there
  // should scroll pills, not arm pull-to-refresh.
  return window.scrollY===0
    &&!isExcludedPullTarget(e.target);
}

document.addEventListener('pointerdown',e=>{
  if(!shouldStartPull(e))return;
  // FIX: call preventDefault() here so Chrome's compositor gesture classifier does
  // NOT run for this touch. With passive:true (old code) Chrome was free to classify
  // the downward swipe as a scroll/overscroll gesture and fire pointercancel before
  // any pointermove handler could run — silently killing the pull every time.
  // Changing to passive:false and calling preventDefault() tells the compositor the
  // event is fully handled by JS, suppressing pointercancel on Android Chrome.
  e.preventDefault();
  state.pull.pointerId=e.pointerId;
  state.pull.input='pointer';
  state.pull.active=true;
  state.pull.startY=e.clientY;
  state.pull.armed=false;
  dom.pullInd.classList.add('active');
  dom.app.classList.add('pull-live');
  dom.app.classList.remove('pull-snap');
},{passive:false});

document.addEventListener('pointermove',e=>{
  if(!state.pull.active||state.pull.input!=='pointer'||e.pointerId!==state.pull.pointerId)return;
  const raw=e.clientY-state.pull.startY;
  if(raw<=0){
    state.pull.dist=0;
    if(state.pull.armed){
      state.pull.armed=false;
      dom.pullInd.classList.remove('armed');
    }
    setPullDistance(0);
    setPullRotation(0);
    return;
  }
  state.pull.dist=rubberBand(raw);
  const fraction=state.pull.dist/PULL_MAX;
  const wasArmed=state.pull.armed;
  state.pull.armed=fraction>=PULL_ARM;
  setPullDistance(state.pull.dist);
  setPullRotation(fraction);
  if(state.pull.armed!==wasArmed){
    dom.pullInd.classList.toggle('armed',state.pull.armed);
    // Haptic feedback on arm (mobile)
    if(state.pull.armed&&navigator.vibrate)navigator.vibrate(10);
  }
  e.preventDefault();
},{passive:false});

document.addEventListener('pointerup',e=>{
  if(!state.pull.active||state.pull.input!=='pointer'||e.pointerId!==state.pull.pointerId)return;
  const armed=state.pull.armed;
  if(armed){
    // BUG FIX: mark pull inactive immediately so any accidental touch during the
    // 480ms reload delay cannot re-trigger the indicator over the spinner.
    state.pull.active=false;
    // Spin the icon, then reload after animation
    dom.pullInd.classList.add('spinning');
    dom.app.classList.remove('pull-live');
    setTimeout(()=>window.location.reload(),480);
  }else{
    resetPull();
  }
});

document.addEventListener('pointercancel',e=>{
  if(!state.pull.active||state.pull.input!=='pointer'||e.pointerId!==state.pull.pointerId)return;
  resetPull();
});

document.addEventListener('touchstart',e=>{
  if(!isCompactPortraitPhone())return;
  if(state.pull.active||e.touches.length!==1)return;
  const touch=e.touches[0];
  if(window.scrollY!==0)return;
  if(!isWithinTopThird(touch.clientY))return;
  if(isExcludedPullTarget(e.target))return;
  e.preventDefault();
  state.pull.input='touch';
  state.pull.touchId=touch.identifier;
  state.pull.active=true;
  state.pull.startY=touch.clientY;
  state.pull.armed=false;
  dom.pullInd.classList.add('active');
  dom.app.classList.add('pull-live');
  dom.app.classList.remove('pull-snap');
},{passive:false});

document.addEventListener('touchmove',e=>{
  if(!state.pull.active||state.pull.input!=='touch')return;
  if(e.touches.length!==1){
    resetPull();
    return;
  }
  const touch=[...e.touches].find(t=>t.identifier===state.pull.touchId);
  if(!touch){
    resetPull();
    return;
  }
  const raw=touch.clientY-state.pull.startY;
  if(raw<=0){
    state.pull.dist=0;
    if(state.pull.armed){
      state.pull.armed=false;
      dom.pullInd.classList.remove('armed');
    }
    setPullDistance(0);
    setPullRotation(0);
    e.preventDefault();
    return;
  }
  state.pull.dist=rubberBand(raw);
  const fraction=state.pull.dist/PULL_MAX;
  const wasArmed=state.pull.armed;
  state.pull.armed=fraction>=PULL_ARM;
  setPullDistance(state.pull.dist);
  setPullRotation(fraction);
  if(state.pull.armed!==wasArmed){
    dom.pullInd.classList.toggle('armed',state.pull.armed);
    if(state.pull.armed&&navigator.vibrate)navigator.vibrate(10);
  }
  e.preventDefault();
},{passive:false});

document.addEventListener('touchend',e=>{
  if(!state.pull.active||state.pull.input!=='touch')return;
  if(e.touches.length>0)return;
  const armed=state.pull.armed;
  if(armed){
    state.pull.active=false;
    dom.pullInd.classList.add('spinning');
    dom.app.classList.remove('pull-live');
    setTimeout(()=>window.location.reload(),480);
  }else{
    resetPull();
  }
},{passive:false});

document.addEventListener('touchcancel',()=>{
  if(!state.pull.active||state.pull.input!=='touch')return;
  resetPull();
},{passive:false});

// === MIDI ===

function clearMidiHeld(){
  // BUG FIX: removed redundant updateMidiButton() call here — it reset the label
  // to "MIDI connect" (off) for a single frame before refreshMidiInputs() in
  // handleMidiStateChange immediately corrected it, causing a visible flicker.
  state.midi.clear();
  update();
}

function refreshMidiInputs(){
  if(!state.midiAccess)return;
  let count=0;
  for(const input of state.midiAccess.inputs.values()){
    input.onmidimessage=handleMidiMessage;
    count++;
  }
  updateMidiButton(
    !state.midiSupported?'MIDI unsupported':count?`MIDI live ${count}`:'MIDI no device',
    count>0,
    !state.midiSupported
  );
}

function handleMidiMessage(e){
  const [status,data1,data2]=e.data;
  const cmd=status&0xf0;
  // Ignore notes outside the 88-key range — a DAW or soft-synth can send any MIDI note
  // (0-127) and unclamped values would corrupt getCenteredWindowMidi0 scroll targeting.
  if(data1<MIN_MIDI||data1>MAX_MIDI)return;
  if(cmd===0x90&&data2>0)state.midi.add(data1);
  else if(cmd===0x80||(cmd===0x90&&data2===0))state.midi.delete(data1);
  update();
}

function handleMidiStateChange(e){
  if(e.port.type==='input'){
    if(e.port.state==='connected')e.port.onmidimessage=handleMidiMessage;
    if(e.port.state==='disconnected')clearMidiHeld();
    refreshMidiInputs();
  }
}

async function connectMidi(){
  if(!state.midiSupported){
    updateMidiButton('MIDI unsupported',false,true);
    dom.fmsg.textContent='Web MIDI not supported here';
    return;
  }
  // BUG FIX: if we already hold a midiAccess object, just refresh the input list
  // instead of re-requesting access (which re-assigned onstatechange unnecessarily).
  if(state.midiAccess){
    refreshMidiInputs();
    const count=[...state.midiAccess.inputs.values()].length;
    dom.fmsg.textContent=count?'midi keyboard connected':'midi ready - connect a device';
    return;
  }
  try{
    state.midiAccess=await navigator.requestMIDIAccess({sysex:false});
    state.midiAccess.onstatechange=handleMidiStateChange;
    refreshMidiInputs();
    dom.fmsg.textContent=[...state.midiAccess.inputs.values()].length?'midi keyboard connected':'midi ready - connect a device';
  }catch(e){
    updateMidiButton('MIDI denied',false,false);
    dom.fmsg.textContent=navigator.onLine?'midi access denied':'midi unavailable offline';
  }
}

function registerPwa(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol==='file:')return;
  if(!(window.isSecureContext||location.hostname==='localhost'||location.hostname==='127.0.0.1'))return;
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  },{once:true});
}

// === INIT ===

dom.midiBtn.addEventListener('click',connectMidi);
dom.octDn.addEventListener('click',()=>shiftWindow(-12));
dom.octUp.addEventListener('click',()=>shiftWindow(12));
// BUG FIX: was using document.getElementById('clrBtn') — now uses the dom cache
dom.clrBtn.addEventListener('click',()=>{
  state.manual.clear();state.midi.clear();
  update();
});
dom.portraitClr.addEventListener('click',()=>{
  state.manual.clear();state.midi.clear();
  update();
});

if(!state.midiSupported){
  updateMidiButton('MIDI unsupported',false,true);
}else{
  // Auto-connect on load: if permission was already granted (e.g. after a reload)
  // requestMIDIAccess resolves immediately with no user prompt.
  // If never granted it will prompt once; subsequent loads are silent.
  connectMidi();
}
update(true);
updateConnectivityStatus();
updateOctBtns();
requestAnimationFrame(()=>dom.app.classList.remove('no-trans'));
window.addEventListener('resize',onResize);
window.addEventListener('online',updateConnectivityStatus);
window.addEventListener('offline',updateConnectivityStatus);
registerPwa();
</script>
</body>
</html>
