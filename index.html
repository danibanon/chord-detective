<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chordet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-maskable.png">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="apple-touch-icon" href="icons/icon-192-maskable.png">
<style>
:root {
  --primary: #d0bcff; --surface: #1c1b1f; --surface-variant: #49454f;
  --on-surface: #e6e1e5; --on-surface-dim: #938f99; --container: #2b2930;
  --key-white: #e6e1e5; --key-black: #2b2930; --key-active-white: #d0bcff;
  --key-active-black: #9a82db;
}

html { font-size: max(10px, min(1.5vw, 2.5dvh)); }
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--surface); color: var(--on-surface);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; height: 100dvh; overflow: hidden; user-select: none;
}

#chord-display {
  flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 1rem 2rem;
  gap: 0.5rem; overflow: hidden;
}

#chord-name {
  font-size: 8rem; font-weight: 700; color: var(--primary);
  letter-spacing: -0.02em; line-height: 1; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 100%;
}

#chord-type, #chord-notes { white-space: nowrap; overflow: hidden; }
#chord-type {
  font-size: 1.2rem; color: var(--on-surface-dim);
  letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600;
}

#chord-notes { font-size: 1rem; color: var(--surface-variant); }

@media (max-height: 200px) { #chord-type, #chord-notes { display: none; } }
@media (max-height: 100px) { #chord-display { display: none; } }

#top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.8rem 1.2rem; gap: 1rem; flex-shrink: 0;
}

#app-title {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 1.2rem; font-weight: 700; color: var(--primary); letter-spacing: 0.04em;
}

#app-title img { width: 1.2em; height: 1.2em; display: block; }

#midi-badge {
  font-size: 0.9rem; color: var(--on-surface-dim); letter-spacing: 0.08em;
  background: var(--container); padding: 0.4em 1.2em; border-radius: 100px;
}

@media (max-height: 180px) { #top-bar { display: none; } }

#piano-scroll {
  overflow-x: auto; overflow-y: hidden; flex-shrink: 0; padding-bottom: 1rem;
  display: flex; justify-content: center; touch-action: pan-x;
}

#piano-keys { position: relative; flex-shrink: 0; }

.key-white, .key-black {
  position: absolute; top: 4px; border: none; cursor: pointer; transition: background 0.08s;
}

.key-white { background: var(--key-white); border-radius: 0 0 8px 8px; box-shadow: 0 2px 6px #0006; }
.key-white.active { background: var(--key-active-white); }
.key-black { background: var(--key-black); border-radius: 0 0 5px 5px; z-index: 2; box-shadow: 0 4px 8px #0009; }
.key-black.active { background: var(--key-active-black); }
</style>
</head>
<body>
<div id="chord-display">
  <div id="chord-name">—</div>
  <div id="chord-type"></div>
  <div id="chord-notes"></div>
</div>

<div id="top-bar">
  <div id="app-title"><img src="icons/logo.svg" alt="">Chordet</div>
  <div id="midi-badge">MIDI: off</div>
</div>

<div id="piano-scroll"><div id="piano-keys"></div></div>

<script>
'use strict';

const Music = (() => {
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const BLACK_PCS = new Set([1, 3, 6, 8, 10]);
  const CHORD_PATTERNS = [
    { suffix: '5', name: 'Power chord', intervals: [0,7] },
    { suffix: '', name: 'Major', intervals: [0,4,7] },
    { suffix: 'm', name: 'Minor', intervals: [0,3,7] },
    { suffix: '°', name: 'Diminished', intervals: [0,3,6] },
    { suffix: '+', name: 'Augmented', intervals: [0,4,8] },
    { suffix: 'sus2', name: 'Suspended second', intervals: [0,2,7] },
    { suffix: 'sus4', name: 'Suspended fourth', intervals: [0,5,7] },
    { suffix: 'M7', name: 'Major seventh', intervals: [0,4,7,11] },
    { suffix: 'm7', name: 'Minor seventh', intervals: [0,3,7,10] },
    { suffix: '7', name: 'Dominant seventh', intervals: [0,4,7,10] },
    { suffix: '7b5', name: 'Seventh flat five', intervals: [0,4,6,10] },
    { suffix: '°7', name: 'Diminished seventh', intervals: [0,3,6,9] },
    { suffix: 'ø7', name: 'Half-diminished', intervals: [0,3,6,10] },
    { suffix: 'mM7', name: 'Minor major seventh', intervals: [0,3,7,11] },
    { suffix: '+M7', name: 'Augmented major seventh', intervals: [0,4,8,11] },
    { suffix: '+7', name: 'Augmented seventh', intervals: [0,4,8,10] },
    { suffix: '6', name: 'Major sixth', intervals: [0,4,7,9] },
    { suffix: 'm6', name: 'Minor sixth', intervals: [0,3,7,9] },
    { suffix: 'add9', name: 'Add nine', intervals: [0,2,4,7] },
    { suffix: 'add11', name: 'Add eleven', intervals: [0,4,5,7] },
    { suffix: 'madd9', name: 'Minor add nine', intervals: [0,2,3,7] },
    { suffix: '7sus4', name: 'Dominant seven sus four', intervals: [0,5,7,10] },
    { suffix: '9', name: 'Dominant ninth', intervals: [0,2,4,7,10] },
    { suffix: 'M9', name: 'Major ninth', intervals: [0,2,4,7,11] },
    { suffix: 'm9', name: 'Minor ninth', intervals: [0,2,3,7,10] },
    { suffix: '11', name: 'Dominant eleventh', intervals: [0,2,4,5,7,10] },
    { suffix: 'm11', name: 'Minor eleventh', intervals: [0,2,3,5,7,10] },
    { suffix: '13', name: 'Dominant thirteenth', intervals: [0,2,4,7,9,10] },
    { suffix: 'M13', name: 'Major thirteenth', intervals: [0,2,4,7,9,11] },
    { suffix: 'm13', name: 'Minor thirteenth', intervals: [0,2,3,7,9,10] },
    { suffix: '6/9', name: 'Six nine', intervals: [0,2,4,7,9] },
    { suffix: '7b9', name: 'Dominant flat nine', intervals: [0,1,4,7,10] },
    { suffix: '7#9', name: 'Dominant sharp nine', intervals: [0,3,4,7,10] }
  ];

  const toPitchClass = midi => ((midi % 12) + 12) % 12;
  const arraysEqual = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

  function matchAtRoot(pitchClasses, root, dropFifth) {
    const intervals = pitchClasses.map(p => (p - root + 12) % 12).sort((a, b) => a - b);
    for (const pattern of CHORD_PATTERNS) {
      const target = dropFifth ? pattern.intervals.filter(v => v !== 7) : pattern.intervals;
      if (dropFifth && target.length === pattern.intervals.length) continue;
      if (arraysEqual(target, intervals)) {
        return dropFifth
          ? { ...pattern, suffix: pattern.suffix + '(no5)', name: pattern.name + ' no 5' }
          : pattern;
      }
    }
    return null;
  }

  function detectChord(midiNotes) {
    if (midiNotes.length < 2) return null;
    const pitchClasses = [...new Set(midiNotes.map(toPitchClass))].sort((a, b) => a - b);
    const bassPC = toPitchClass(Math.min(...midiNotes));
    const rootCandidates = [bassPC, ...pitchClasses.filter(p => p !== bassPC)];
    for (const dropFifth of [false, true]) {
      for (const root of rootCandidates) {
        const pattern = matchAtRoot(pitchClasses, root, dropFifth);
        if (pattern) {
          return {
            rootName: NOTE_NAMES[root],
            suffix: pattern.suffix,
            fullName: pattern.name,
            slashBass: bassPC !== root ? '/' + NOTE_NAMES[bassPC] : ''
          };
        }
      }
    }
    return null;
  }

  return {
    detectChord,
    noteName: midi => NOTE_NAMES[toPitchClass(midi)],
    isBlackKey: midi => BLACK_PCS.has(toPitchClass(midi))
  };
})();

const NoteState = (() => {
  const manual = new Set();
  const heldMidi = new Set();
  const sustained = new Set();
  let pedalDown = false;

  function getActive() { return [...new Set([...manual, ...heldMidi, ...sustained])].sort((a, b) => a - b); }
  function toggleManual(note) { manual.has(note) ? manual.delete(note) : manual.add(note); }
  function noteOn(note) { heldMidi.add(note); sustained.add(note); }
  function noteOff(note) {
    heldMidi.delete(note);
    if (!pedalDown) sustained.delete(note);
  }
  function setPedal(isDown) {
    pedalDown = isDown;
    if (!isDown) for (const note of sustained) if (!heldMidi.has(note)) sustained.delete(note);
  }

  return { getActive, toggleManual, noteOn, noteOff, setPedal };
})();

const PianoView = (() => {
  const MIDI_MIN = 21, MIDI_MAX = 108, WHITE_COUNT = 52;
  const els = {
    scroll: document.getElementById('piano-scroll'),
    keys: document.getElementById('piano-keys'),
    chordName: document.getElementById('chord-name'),
    chordType: document.getElementById('chord-type'),
    chordNotes: document.getElementById('chord-notes'),
    topBar: document.getElementById('top-bar'),
    midiBadge: document.getElementById('midi-badge')
  };

  function describeNotes(activeNotes) {
    if (activeNotes.length === 0) return { name: '—', type: '', notes: '' };
    if (activeNotes.length === 1) return { name: Music.noteName(activeNotes[0]), type: 'note', notes: '' };
    const chord = Music.detectChord(activeNotes);
    const notes = activeNotes.map(Music.noteName).join(' · ');
    return chord
      ? {
          name: chord.rootName + chord.suffix + chord.slashBass,
          type: chord.rootName + ' ' + chord.fullName + (chord.slashBass ? ' / ' + chord.slashBass.slice(1) : ''),
          notes
        }
      : { name: '?', type: 'unrecognised', notes };
  }

  function refresh() {
    const activeNotes = NoteState.getActive();
    const { name, type, notes } = describeNotes(activeNotes);
    els.chordName.textContent = name;
    els.chordType.textContent = type;
    els.chordNotes.textContent = notes;
    const activeSet = new Set(activeNotes);
    els.keys.querySelectorAll('[data-midi]').forEach(key => key.classList.toggle('active', activeSet.has(+key.dataset.midi)));
  }

  function build() {
    const available = window.innerHeight - els.topBar.offsetHeight;
    const pianoH = Math.max(80, Math.min(Math.round(window.innerHeight * 0.38), available - 20));
    const whiteW = Math.max(8, Math.min(Math.floor(pianoH * 23 / 150), Math.floor(window.innerWidth / WHITE_COUNT)));
    const whiteH = Math.round(whiteW * 150 / 23);
    const dims = { whiteW, whiteH, blackW: Math.round(whiteW * 11 / 23), blackH: Math.round(whiteH * 90 / 150) };

    els.scroll.style.height = (dims.whiteH + (parseInt(getComputedStyle(els.scroll).paddingBottom, 10) || 8) + 4) + 'px';
    els.keys.style.width = WHITE_COUNT * dims.whiteW + 'px';
    els.keys.style.height = dims.whiteH + 'px';
    els.keys.innerHTML = '';

    let whiteIndex = 0;
    for (let midi = MIDI_MIN; midi <= MIDI_MAX; midi++) {
      const keyEl = document.createElement('div');
      keyEl.className = Music.isBlackKey(midi) ? 'key-black' : 'key-white';
      keyEl.dataset.midi = midi;
      if (keyEl.className === 'key-black') keyEl.style.cssText = `width:${dims.blackW}px;height:${dims.blackH}px;left:${whiteIndex * dims.whiteW - dims.blackW / 2}px`;
      else {
        keyEl.style.cssText = `width:${dims.whiteW - 1}px;height:${dims.whiteH}px;left:${whiteIndex * dims.whiteW}px`;
        whiteIndex++;
      }
      els.keys.appendChild(keyEl);
    }
    refresh();
  }

  return { build, refresh, setMidiBadge: text => { els.midiBadge.textContent = 'MIDI: ' + text; } };
})();

const MidiInput = (() => {
  function handleMessage({ data }) {
    const [statusByte, note, velocity] = data;
    const command = statusByte & 0xf0;
    if (command === 0x90 && velocity > 0) NoteState.noteOn(note);
    else if (command === 0x80 || (command === 0x90 && velocity === 0)) NoteState.noteOff(note);
    else if (command === 0xb0 && note === 64) NoteState.setPedal(velocity >= 64);
    PianoView.refresh();
  }

  function attach(access) {
    let count = 0;
    for (const input of access.inputs.values()) {
      input.onmidimessage = handleMessage;
      count++;
    }
    PianoView.setMidiBadge(count ? 'connected' : 'waiting');
  }

  return {
    init: async () => {
      if (!navigator.requestMIDIAccess) return;
      try {
        const access = await navigator.requestMIDIAccess({ sysex: false });
        attach(access);
        access.onstatechange = () => attach(access);
      } catch {
        PianoView.setMidiBadge('denied');
      }
    }
  };
})();

document.getElementById('piano-keys').addEventListener('pointerdown', event => {
  const key = event.target.closest('[data-midi]');
  if (key) {
    NoteState.toggleManual(+key.dataset.midi);
    PianoView.refresh();
  }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
PianoView.build();
MidiInput.init();
window.addEventListener('resize', PianoView.build);
</script>
</body>
</html>
